<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ember</title>
<style>
  /* ===== 设计 token（怀旧版 / Claude Theme，取自 DESIGN 设计稿）===== */
  :root {
    --font-display: 'Anthropic Serif', Georgia, 'Times New Roman', serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    --bg-primary: #faf9f5;
    --bg-card: #ffffff;
    --text-primary: #141413;
    --text-secondary: #3d3d3a;
    --text-muted: #9b9b97;
    --accent: #d97757;
    --btn-primary-bg: #3b3b3b;

    --shadow:    0 3px 15px rgba(0,0,0,0.05), 0 0 0 0.5px rgba(31,30,29,0.12);
    --shadow-sm: 0 3px 15px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(31,30,29,0.2);

    --radius: 20px;
    --radius-sm: 8px;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --motion-fast: 160ms;
    --motion-panel: 240ms;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    flex: none;
    position: relative;
    z-index: 4;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    min-height: calc(64px + env(safe-area-inset-top));
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px 18px;
    border-bottom: 0.5px solid rgba(31,30,29,0.12);
    background: var(--bg-primary);
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .model-control {
    position: relative;
    justify-self: center;
    min-width: 0;
  }
  .model-quick {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 44px;
    max-width: 138px;
    min-height: 44px;
    padding: 7px 10px;
    border: none;
    border-radius: 12px;
    color: var(--text-secondary);
    background: transparent;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }
  .model-quick:active,
  .icon-button:active {
    transform: scale(.97);
  }
  .model-quick-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-quick svg {
    flex: none;
    width: 15px;
    height: 15px;
    transition: transform var(--motion-fast) var(--ease-out);
  }
  .model-quick[aria-expanded="true"] svg { transform: rotate(180deg); }
  .topbar-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .tool-clear {
    min-width: 44px;
    min-height: 44px;
    border: none;
    border-radius: 12px;
    padding: 6px 8px;
    color: var(--text-muted);
    background: transparent;
    font-size: 13px;
    cursor: pointer;
  }
  .tool-clear:disabled {
    opacity: .35;
    cursor: default;
  }
  .icon-button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: color var(--motion-fast) ease, transform var(--motion-fast) var(--ease-out);
  }
  .icon-button svg,
  .settings-back svg,
  .search-icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .quick-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    width: min(280px, calc(100vw - 24px));
    padding: 14px;
    color: var(--text-primary);
    background: rgba(255,255,255,.97);
    border-radius: 18px;
    box-shadow: 0 14px 38px rgba(31,30,29,.15), 0 0 0 .5px rgba(31,30,29,.16);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(-50%) translateY(-5px) scale(.98);
    transform-origin: top center;
    transition:
      opacity var(--motion-fast) var(--ease-out),
      transform var(--motion-fast) var(--ease-out),
      visibility 0s linear var(--motion-fast);
  }
  .quick-panel.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0) scale(1);
    transition-delay: 0s;
  }
  .quick-model-id {
    display: block;
    margin-bottom: 11px;
    overflow: hidden;
    color: var(--text-muted);
    font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .control-label {
    display: block;
    margin-bottom: 7px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .effort-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 4px;
    background: rgba(31,30,29,.07);
    border-radius: 12px;
  }
  .effort-option {
    min-height: 44px;
    padding: 6px 3px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 9px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .effort-option[aria-pressed="true"] {
    color: #fff;
    background: var(--btn-primary-bg);
  }
  .effort-option:disabled {
    opacity: .35;
    cursor: default;
  }
  .quick-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 44px;
    margin-top: 8px;
    padding: 5px 3px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-top: .5px solid rgba(31,30,29,.1);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .quick-state {
    color: var(--text-muted);
    font-size: 12px;
  }
  .quick-chevron {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--text-muted);
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .spark {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }
  .brand {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--text-primary);
    letter-spacing: 0.2px;
  }

  /* ===== 消息区 ===== */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .hint {
    margin: auto;
    color: var(--text-muted);
    font-size: 14px;
  }

  .msg {
    max-width: 85%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: var(--shadow);
    border-bottom-left-radius: 6px;
  }
  .reasoning {
    align-self: flex-start;
    max-width: 85%;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .reasoning-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .reasoning-mark {
    position: relative;
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg, rgba(217,119,87,0), rgba(217,119,87,0.95), rgba(217,119,87,0));
    animation: spin 1.4s linear infinite;
  }
  .reasoning-mark::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--bg-primary);
  }
  .reasoning.is-done .reasoning-mark {
    border: 1.5px solid rgba(31,30,29,0.32);
    background: transparent;
    animation: none;
  }
  .reasoning.is-done .reasoning-mark::after {
    inset: 4px;
    width: 7px;
    height: 4px;
    border-left: 1.5px solid rgba(31,30,29,0.55);
    border-bottom: 1.5px solid rgba(31,30,29,0.55);
    border-radius: 0;
    background: transparent;
    transform: rotate(-45deg);
  }
  .reasoning-title {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .reasoning-done {
    display: none;
    color: var(--text-muted);
  }
  .reasoning.is-done .reasoning-done {
    display: inline;
  }
  .reasoning-chevron {
    color: var(--text-muted);
    transition: transform .18s ease;
  }
  .reasoning.is-open .reasoning-chevron {
    transform: rotate(180deg);
  }
  .reasoning-body {
    display: none;
    margin: 10px 0 0 9px;
    padding: 0 0 0 18px;
    border-left: 1px solid rgba(31,30,29,0.14);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reasoning.is-open .reasoning-body {
    display: block;
  }
  .reasoning-tools {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0 0 9px;
    padding: 0 0 0 18px;
    border-left: 1px solid rgba(31,30,29,0.14);
    color: var(--text-muted);
  }
  .reasoning:not(.is-open) .reasoning-tools {
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .citations {
    align-self: flex-start;
    max-width: 85%;
    min-width: 0;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .citations-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: 100%;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .citations-chevron {
    flex: none;
    color: var(--text-muted);
    transition: transform .18s ease;
  }
  .citations.is-open .citations-chevron {
    transform: rotate(180deg);
  }
  .citations-list {
    display: none;
    flex-direction: column;
    gap: 6px;
    max-width: 100%;
    margin-top: 8px;
  }
  .citations.is-open .citations-list {
    display: flex;
  }
  .citations-list a {
    max-width: 100%;
    color: var(--text-secondary);
    overflow-wrap: anywhere;
  }
  .msg.error {
    align-self: flex-start;
    background: #fbeae5;
    color: #9a3412;
    box-shadow: none;
  }
  .cache-badge {
    align-self: flex-start;
    max-width: 85%;
    margin-top: -6px;
    padding-left: 15px;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.4;
  }
  .cache-badge .num {
    font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
  }
  .cache-badge.hit .num {
    color: var(--accent);
  }
  .cache-badge.write .num {
    color: var(--text-secondary);
  }
  /* 等待首字时的呼吸光标 */
  .msg.typing::after {
    content: '';
    display: inline-block;
    width: 7px; height: 7px;
    margin: 0 2px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

  /* ===== 底部输入栏 ===== */
  .composer {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 0.5px solid rgba(31,30,29,0.12);
    background: var(--bg-primary);
  }
  #input {
    flex: 1;
    resize: none;
    max-height: 120px;
    padding: 11px 15px;
    font-family: var(--font-ui);
    font-size: 16px;            /* ≥16px：避免 iOS 聚焦时自动放大 */
    line-height: 1.5;
    color: var(--text-primary);
    background: var(--bg-card);
    border: none;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    outline: none;
  }
  #input::placeholder { color: var(--text-muted); }

  #send {
    flex: none;
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--btn-primary-bg);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    transition: opacity .2s, transform .2s;
  }
  #send:hover:not(:disabled) { opacity: .85; transform: translateY(-1px); }
  #send:disabled { opacity: .4; cursor: default; }

  /* ===== 全屏设置 ===== */
  .settings-screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-primary);
    visibility: hidden;
    pointer-events: none;
    opacity: .98;
    transform: translateX(100%);
    transition:
      transform var(--motion-panel) var(--ease-out),
      opacity var(--motion-panel) var(--ease-out),
      visibility 0s linear var(--motion-panel);
  }
  .settings-child-screen { z-index: 21; }
  .settings-screen.skip-motion { transition: none !important; }
  .settings-screen.is-open {
    visibility: visible;
    pointer-events: auto;
    opacity: 1;
    transform: translateX(0);
    transition-delay: 0s;
  }
  .settings-header {
    flex: none;
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    min-height: calc(64px + env(safe-area-inset-top));
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    border-bottom: .5px solid rgba(31,30,29,.12);
    background: var(--bg-primary);
  }
  .settings-header h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 500;
    line-height: 1.2;
    text-align: center;
  }
  .settings-back,
  .settings-nav-row,
  .model-star,
  .models-retry,
  .token-step,
  .models-scroll-top {
    -webkit-tap-highlight-color: transparent;
  }
  .settings-back {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 12px;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .settings-back svg,
  .settings-nav-chevron,
  .models-scroll-top svg,
  .token-step svg {
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .settings-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .settings-content {
    width: min(100%, 720px);
    margin: 0 auto;
    padding: 20px 18px 36px;
  }
  .settings-main-content { max-width: 600px; }
  .settings-section + .settings-section { margin-top: 22px; }
  .settings-section-title {
    margin: 0 0 8px 3px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 650;
  }
  .settings-nav-group,
  .settings-card,
  .model-list {
    background: var(--bg-card);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  .settings-nav-group,
  .model-list { overflow: hidden; }
  .settings-nav-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 72px;
    padding: 13px 13px 13px 15px;
    color: var(--text-primary);
    background: transparent;
    border: none;
    font: inherit;
    text-align: left;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .settings-nav-row + .settings-nav-row::before {
    content: "";
    position: absolute;
    top: 0;
    right: 14px;
    left: 58px;
    height: .5px;
    background: rgba(31,30,29,.1);
  }
  .settings-nav-icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    color: var(--accent);
    background: rgba(217,119,87,.1);
    border-radius: 10px;
  }
  .settings-nav-icon svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .current-model-mark {
    width: 22px;
    height: 22px;
    border: 6px solid var(--accent);
    border-radius: 50%;
  }
  .settings-nav-copy {
    min-width: 0;
    flex: 1;
  }
  .settings-nav-title,
  .settings-nav-summary {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .settings-nav-title {
    font-size: 15px;
    font-weight: 650;
  }
  .settings-nav-summary {
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .settings-model-id {
    font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 11px;
  }
  .settings-nav-chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: #b5b5b0;
    stroke-width: 1.8;
  }
  .settings-card { padding: 15px; }
  .settings-card-label {
    display: block;
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: 650;
  }
  .settings-note {
    margin: 9px 0 0;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .generation-card { padding: 0; overflow: hidden; }
  .generation-block { padding: 15px; }
  .generation-block + .generation-block {
    border-top: .5px solid rgba(31,30,29,.1);
  }
  .max-token-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .max-token-row > .settings-card-label { margin: 0; }
  .max-token-controls {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #max-completion-tokens {
    width: 104px;
    min-height: 44px;
    padding: 9px 10px;
    color: var(--text-primary);
    background: rgba(31,30,29,.045);
    border: .5px solid rgba(31,30,29,.13);
    border-radius: 12px;
    outline: none;
    font: 14px 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    text-align: center;
    appearance: textfield;
  }
  #max-completion-tokens::-webkit-inner-spin-button,
  #max-completion-tokens::-webkit-outer-spin-button { appearance: none; margin: 0; }
  #max-completion-tokens::placeholder { color: var(--text-muted); }
  .token-step {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    color: var(--text-secondary);
    background: rgba(31,30,29,.045);
    border: .5px solid rgba(31,30,29,.13);
    border-radius: 12px;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .token-step svg { width: 17px; height: 17px; stroke-width: 1.8; }
  .max-token-error {
    display: block;
    min-height: 17px;
    margin: 7px 1px 0;
    color: #9a3412;
    font-size: 11px;
    line-height: 1.4;
  }
  .model-toolbar {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 14px 18px 4px;
    background: linear-gradient(var(--bg-primary) 80%, rgba(250,249,245,0));
  }
  .model-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
    color: var(--text-muted);
  }
  .model-search-wrap .search-icon {
    position: absolute;
    left: 13px;
    width: 17px;
    height: 17px;
    pointer-events: none;
  }
  #model-search {
    width: 100%;
    min-height: 46px;
    padding: 10px 42px 10px 39px;
    color: var(--text-primary);
    background: rgba(31,30,29,.06);
    border: none;
    border-radius: 14px;
    outline: none;
    font: inherit;
    font-size: 16px;
  }
  #model-search::placeholder,
  #system-prompt::placeholder { color: var(--text-muted); }
  .models-retry {
    position: absolute;
    right: 1px;
    display: grid;
    place-items: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: 10px;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .models-retry svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;

  function loadReasoningEffort() {
    const saved = localStorage.getItem(REASONING_EFFORT_KEY);
    if (EFFORT_OPTIONS.some((item) => item.value === saved)) return saved;
    return localStorage.getItem(LEGACY_REASONING_KEY) === "0" ? "off" : "medium";
  }

  function loadMaxCompletionTokens() {
    const saved = localStorage.getItem(MAX_COMPLETION_TOKENS_KEY);
    if (saved === null || saved === "") return null;
    const value = Number(saved);
    return Number.isInteger(value) && value > 0 ? value : null;
  }

  function createSessionId() {
    if (typeof crypto?.randomUUID === "function") return crypto.randomUUID();
    return `chat-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
  }

  function loadSessionId() {
    const saved = localStorage.getItem(SESSION_KEY);
    if (saved && saved.length <= 256) return saved;
    const created = createSessionId();
    localStorage.setItem(SESSION_KEY, created);
    return created;
  }

  function normalizeFavorites(items) {
    if (!Array.isArray(items)) return [];
    const seen = new Set();
    const normalized = [];
    for (const item of items) {
      const id = String(item?.id || item || "").trim();
      const label = String(item?.label || "").trim();
      if (!id || seen.has(id)) continue;
      seen.add(id);
      normalized.push({ id, label: label || friendlyModelName(id) });
    }
    return normalized;
  }

  function loadFavorites() {
    const saved = normalizeFavorites(parseStoredJson(FAVORITES_KEY, []));
    return saved.length ? saved : [{ id: currentModel || DEFAULT_MODEL, label: friendlyModelName(currentModel || DEFAULT_MODEL) }];
  }

  function normalizeModel(item) {
    const id = String(item?.id || "").trim();
    if (!id) return null;
    return {
      id,
      name: String(item?.name || "").trim(),
      description: String(item?.description || "").trim().slice(0, 600),
      contextLength: Number(item?.contextLength || 0) || null,
      maxCompletionTokens: Number(item?.maxCompletionTokens || 0) || null,
      pricing: item?.pricing && typeof item.pricing === "object" ? item.pricing : null,
      reasoning: item?.reasoning && typeof item.reasoning === "object" ? item.reasoning : null,
      supportedParameters: Array.isArray(item?.supportedParameters) ? item.supportedParameters : [],
    };
  }

  function loadModelCatalog() {
    const items = parseStoredJson(MODEL_CATALOG_KEY, []);
    if (!Array.isArray(items)) return [];
    return items.map(normalizeModel).filter(Boolean);
  }

  function saveModelCatalog(items) {
    const safe = items.map(normalizeModel).filter(Boolean);
    fetchedModels = safe;
    try {
      localStorage.setItem(MODEL_CATALOG_KEY, JSON.stringify(safe));
    } catch {
      // 模型目录只是离线备用，浏览器空间不足时不影响聊天和收藏。
    }
  }

  function friendlyModelName(modelId) {
    let slug = String(modelId || DEFAULT_MODEL).split("/").pop() || "";
    slug = slug.replace(/:[^:]+$/, "").replace(/^claude-/i, "");
    slug = slug
      .replace(/^gpt-/i, "GPT ")
      .replace(/^gemini-/i, "Gemini ")
      .replace(/^grok-/i, "Grok ")
      .replace(/^deepseek-/i, "DeepSeek ")
      .replace(/^qwen-/i, "Qwen ")
      .replace(/-/g, " ")
      .replace(/\b(opus|sonnet|haiku|pro|flash|mini|max)\b/gi, (word) =>
        word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
      )
      .replace(/\s+/g, " ")
      .trim();
    return slug || "当前模型";
  }

  function modelById(modelId) {
    return fetchedModels.find((item) => item.id === modelId) || null;
  }

  function modelLabel(modelId) {
    const model = modelById(modelId);
    return friendlyModelName(model?.id || modelId);
  }

  function effortAllowed(model, value) {
    const reasoning = model?.reasoning;
    if (value === "off") return reasoning?.mandatory !== true;
    const supported = reasoning?.supported_efforts;
    if (Array.isArray(supported) && supported.length) return supported.includes(value);
    if (model && model.supportedParameters.length && !model.supportedParameters.includes("reasoning")) {
      return false;
    }
    return true;
  }

  function normalizeEffortForModel(value, model) {
    if (effortAllowed(model, value)) return value;
    const supported = model?.reasoning?.supported_efforts;
    const preferred = model?.reasoning?.default_effort;
    if (preferred && EFFORT_OPTIONS.some((item) => item.value === preferred) && effortAllowed(model, preferred)) {
      return preferred;
    }
    if (Array.isArray(supported)) {
      for (const option of ["medium", "low", "high"]) {
        if (supported.includes(option)) return option;
      }
    }
    return model?.reasoning?.mandatory ? "medium" : "off";
  }

  function renderEffortOptions(container, selected, model, onSelect) {
    container.replaceChildren();
    EFFORT_OPTIONS.forEach((option) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "effort-option";
      button.textContent = option.label;
      button.dataset.effort = option.value;
      button.disabled = !effortAllowed(model, option.value);
      button.setAttribute("aria-pressed", String(option.value === selected));
      button.addEventListener("click", () => onSelect(option.value));
      container.appendChild(button);
    });
  }

  function updateTopbar() {
    modelQuickLabel.textContent = modelLabel(currentModel);
    quickModelId.textContent = currentModel;
    const model = modelById(currentModel);
    renderEffortOptions(quickEffortOptions, reasoningEffort, model, setQuickEffort);
    webToggle.setAttribute("aria-pressed", String(webSearchEnabled));
    webState.textContent = webSearchEnabled ? "开" : "关";
  }

  function setQuickEffort(value) {
    reasoningEffort = normalizeEffortForModel(value, modelById(currentModel));
    localStorage.setItem(REASONING_EFFORT_KEY, reasoningEffort);
    updateTopbar();
  }

  function settingsState() {
    return JSON.stringify({
      model: draftModel,
      reasoningEffort: draftReasoningEffort,
      systemPrompt: systemPromptInput.value,
      maxCompletionTokens: draftMaxCompletionTokens,
    });
  }

  function maxTokensValidationMessage() {
    const raw = draftMaxCompletionTokens.trim();
    if (!raw) return "";
    if (!/^\d+$/.test(raw) || !Number.isSafeInteger(Number(raw)) || Number(raw) < 1) {
      return "请输入大于 0 的整数，或留空使用自动。";
    }
    const modelMax = modelById(draftModel)?.maxCompletionTokens;
    if (modelMax && Number(raw) > modelMax) {
      return `当前模型最多支持 ${modelMax.toLocaleString()} token。`;
    }
    return "";
  }

  function updateMaxTokensUi() {
    const modelMax = modelById(draftModel)?.maxCompletionTokens;
    maxTokensNote.textContent = modelMax
      ? `包含内部思考；留空为自动 · 当前模型最多 ${modelMax.toLocaleString()}`
      : "包含内部思考；留空为自动";
    const message = maxTokensValidationMessage();
    maxTokensError.textContent = message;
    maxCompletionTokensInput.setAttribute("aria-invalid", String(Boolean(message)));
    settingsSave.disabled = Boolean(message);
    return !message;
  }

  function updateSettingsDirty() {
    settingsSave.textContent = "保存并返回";
    updateMaxTokensUi();
  }

  function updatePromptCount() {
    const length = systemPromptInput.value.length;
    promptCount.textContent = `${length.toLocaleString()} 字`;
    settingsPromptSummary.textContent = systemPromptInput.value.trim()
      ? `已设置 · ${length.toLocaleString()} 字`
      : "未设置";
    updateSettingsDirty();
  }

  function autoGrowSystemPrompt() {
    systemPromptInput.style.height = "auto";
    systemPromptInput.style.height = `${Math.max(systemPromptInput.scrollHeight, 220)}px`;
  }

  function stepMaxCompletionTokens(direction) {
    const raw = draftMaxCompletionTokens.trim();
    const current = /^\d+$/.test(raw) ? Number(raw) : 0;
    const next = direction > 0 ? current + 1024 : current - 1024;
    draftMaxCompletionTokens = next > 0 ? String(next) : "";
    maxCompletionTokensInput.value = draftMaxCompletionTokens;
    updateSettingsDirty();
  }

  function updateSettingsModel() {
    const model = modelById(draftModel);
    settingsModelName.textContent = modelLabel(draftModel);
    settingsModelId.textContent = draftModel;
    draftReasoningEffort = normalizeEffortForModel(draftReasoningEffort, model);
    renderEffortOptions(settingsEffortOptions, draftReasoningEffort, model, (value) => {
      draftReasoningEffort = normalizeEffortForModel(value, model);
      updateSettingsModel();
      updateSettingsDirty();
    });
    if (model?.reasoning?.mandatory) {
      reasoningNote.textContent = "这个模型必须推理，不能关闭；这里只显示它支持的档位。";
    } else if (model && model.supportedParameters.length && !model.supportedParameters.includes("reasoning")) {
      reasoningNote.textContent = "这个模型没有提供可调推理程度，发送时会关闭推理。";
    } else {
      reasoningNote.textContent = "越高越适合复杂问题，也会花更多时间和 token。";
    }
    updateMaxTokensUi();
  }

  function collectVisibleModels() {
    const query = modelSearch.value.trim().toLowerCase();
    const favoriteIds = new Set(draftFavorites.map((item) => item.id));
    const byId = new Map();
    for (const favorite of draftFavorites) {
      const fetched = modelById(favorite.id);
      byId.set(favorite.id, fetched || normalizeModel({ id: favorite.id, name: favorite.label }));
    }
    for (const model of fetchedModels) byId.set(model.id, model);
    if (!byId.has(draftModel)) byId.set(draftModel, normalizeModel({ id: draftModel }));
    const matches = (model) => {
      if (!query) return true;
      return `${model.id} ${model.name} ${model.description}`.toLowerCase().includes(query);
    };
    const favorites = [...byId.values()].filter((model) => favoriteIds.has(model.id) && matches(model));
    const others = [...byId.values()].filter((model) => !favoriteIds.has(model.id) && matches(model));
    return { favorites, others };
  }

  function makeStarIcon() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path></svg>';
  }

  function appendModelGroup(label, models) {
    if (!models.length) return;
    const heading = document.createElement("div");
    heading.className = "model-group-label";
    heading.textContent = label;
    modelList.appendChild(heading);
    for (const model of models) {
      const row = document.createElement("div");
      row.className = "model-choice" + (model.id === draftModel ? " active" : "");

      const text = document.createElement("span");
      text.className = "model-choice-text";
      const name = document.createElement("strong");
      name.className = "model-choice-name";
      name.textContent = friendlyModelName(model.id);
      const id = document.createElement("span");
      id.className = "model-choice-id";
      id.textContent = model.id;
      text.append(name, id);

      const selectButton = document.createElement("button");
      selectButton.type = "button";
      selectButton.className = "model-choice-select";
      selectButton.setAttribute("aria-pressed", String(model.id === draftModel));
      selectButton.appendChild(text);

      const favorite = draftFavorites.some((item) => item.id === model.id);
      const star = document.createElement("button");
      star.type = "button";
      star.className = "model-star";
      star.innerHTML = makeStarIcon();
      star.setAttribute("aria-label", favorite ? `取消收藏 ${name.textContent}` : `收藏 ${name.textContent}`);
      star.setAttribute("aria-pressed", String(favorite));
      star.addEventListener("click", (event) => {
        event.stopPropagation();
        if (favorite) {
          draftFavorites = draftFavorites.filter((item) => item.id !== model.id);
        } else {
          draftFavorites = normalizeFavorites([
            ...draftFavorites,
            { id: model.id, label: friendlyModelName(model.id) },
          ]);
        }
        favoriteModels = normalizeFavorites(draftFavorites);
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(favoriteModels));
        renderModelList();
      });

      const select = () => {
        draftModel = model.id;
        draftReasoningEffort = normalizeEffortForModel(draftReasoningEffort, model);
        updateSettingsModel();
        renderModelList();
        updateSettingsDirty();
      };
      selectButton.addEventListener("click", select);
      row.append(selectButton, star);
      modelList.appendChild(row);
    }
  }

  function renderModelList() {
    modelList.replaceChildren();
    const { favorites, others } = collectVisibleModels();
    appendModelGroup("收藏模型", favorites);
    appendModelGroup(modelSearch.value.trim() ? "搜索结果" : "全部模型", others);
    if (!favorites.length && !others.length) {
      const empty = document.createElement("div");
      empty.className = "model-group-label";
      empty.textContent = modelsLoading ? "正在拉取模型…" : "没有找到模型";
      modelList.appendChild(empty);
    }
  }

  async function fetchModels({ force = false } = {}) {
    if (modelsLoading || (modelsLoadedThisPage && !force)) return;
    modelsLoading = true;
    modelsStatus.textContent = "正在从 OpenRouter 拉取模型…";
    modelsRetry.disabled = true;
    renderModelList();
    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "models", password: accessPw }),
      });
      if (response.status === 401) {
        localStorage.removeItem(PW_KEY);
        accessPw = "";
        showGate("密码已失效，请重新输入");
        throw new Error("需要重新输入访问密码");
      }
      const payload = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error(payload?.error || `服务返回 ${response.status}`);
      }
      const models = Array.isArray(payload?.models) ? payload.models : [];
      saveModelCatalog(models);
      modelsLoadedThisPage = true;
      modelsStatus.textContent = `已拉取 ${fetchedModels.length.toLocaleString()} 个模型`;
      updateSettingsModel();
    } catch (error) {
      modelsStatus.textContent = `拉取失败：${error.message}。已保留本地模型，可点右侧重试。`;
    } finally {
      modelsLoading = false;
      modelsRetry.disabled = false;
      renderModelList();
    }
  }

  function openQuickPanel() {
    const open = !quickPanel.classList.contains("is-open");
    quickPanel.classList.toggle("is-open", open);
    quickPanel.setAttribute("aria-hidden", String(!open));
    modelQuick.setAttribute("aria-expanded", String(open));
  }

  function closeQuickPanel() {
    quickPanel.classList.remove("is-open");
    quickPanel.setAttribute("aria-hidden", "true");
    modelQuick.setAttribute("aria-expanded", "false");
  }

  function openSettings() {
    settingsTrigger = document.activeElement;
    closeQuickPanel();
    draftModel = currentModel;
    draftFavorites = favoriteModels.map((item) => ({ ...item }));
    draftReasoningEffort = reasoningEffort;
    draftMaxCompletionTokens = maxCompletionTokens === null ? "" : String(maxCompletionTokens);
    modelSearch.value = "";
    systemPromptInput.value = systemPrompt;
    maxCompletionTokensInput.value = draftMaxCompletionTokens;
    updateSettingsModel();
    renderModelList();
    updatePromptCount();
    settingsSnapshot = settingsState();
    updateSettingsDirty();
    settingsScreen.classList.add("is-open");
    settingsScreen.setAttribute("aria-hidden", "false");
    document.querySelector(".topbar").inert = true;
    messagesEl.inert = true;
    composer.inert = true;
    settingsBack.focus();
    requestAnimationFrame(autoGrowSystemPrompt);
  }

  function openModelScreen() {
    settingsScreen.inert = true;
    modelScreen.classList.add("is-open");
    modelScreen.setAttribute("aria-hidden", "false");
    modelScroll.scrollTop = 0;
    modelSearch.value = "";
    renderModelList();
    modelsStatus.textContent = fetchedModels.length
      ? `本地已有 ${fetchedModels.length.toLocaleString()} 个模型，正在刷新…`
      : "准备拉取 OpenRouter 模型…";
    modelBack.focus();
    updateModelScrollTop();
    void fetchModels({ force: true });
  }

  function skipPanelMotionOnce(screen) {
    screen.classList.add("skip-motion");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      screen.classList.remove("skip-motion");
    }));
  }

  function closeModelScreen({ instant = false } = {}) {
    if (instant) skipPanelMotionOnce(modelScreen);
    modelScreen.classList.remove("is-open");
    modelScreen.setAttribute("aria-hidden", "true");
    settingsScreen.inert = false;
    settingsModelOpen.focus();
  }

  function openPromptScreen() {
    settingsScreen.inert = true;
    promptScreen.classList.add("is-open");
    promptScreen.setAttribute("aria-hidden", "false");
    promptScroll.scrollTop = 0;
    promptBack.focus();
    requestAnimationFrame(autoGrowSystemPrompt);
  }

  function closePromptScreen({ instant = false } = {}) {
    if (instant) skipPanelMotionOnce(promptScreen);
    promptScreen.classList.remove("is-open");
    promptScreen.setAttribute("aria-hidden", "true");
    settingsScreen.inert = false;
    updatePromptCount();
    settingsPromptOpen.focus();
  }

  function updateModelScrollTop() {
    const visible = modelScroll.scrollTop > 360;
    modelsScrollTop.classList.toggle("is-visible", visible);
  }

  function scrollModelsToTop() {
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    modelScroll.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
  }

  function closeSettings({ force = false, instant = false } = {}) {
    if (!force && settingsState() !== settingsSnapshot && !window.confirm("放弃还没保存的设置？")) {
      return;
    }
    modelScreen.classList.remove("is-open");
    modelScreen.setAttribute("aria-hidden", "true");
    promptScreen.classList.remove("is-open");
    promptScreen.setAttribute("aria-hidden", "true");
    settingsScreen.inert = false;
    if (instant) skipPanelMotionOnce(settingsScreen);
    settingsScreen.classList.remove("is-open");
    settingsScreen.setAttribute("aria-hidden", "true");
    document.querySelector(".topbar").inert = false;
    messagesEl.inert = false;
    composer.inert = false;
    const returnTarget = settingsTrigger;
    settingsTrigger = null;
    if (returnTarget instanceof HTMLElement) returnTarget.focus();
  }

  function saveSettings() {
    if (!updateMaxTokensUi()) {
      maxCompletionTokensInput.focus();
      return;
    }
    if (settingsState() !== settingsSnapshot) {
      currentModel = draftModel || DEFAULT_MODEL;
      favoriteModels = normalizeFavorites(draftFavorites);
      reasoningEffort = draftReasoningEffort;
      systemPrompt = systemPromptInput.value.trim();
      maxCompletionTokens = draftMaxCompletionTokens
        ? Number(draftMaxCompletionTokens)
        : null;
      localStorage.setItem(MODEL_KEY, currentModel);
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favoriteModels));
      localStorage.setItem(REASONING_EFFORT_KEY, reasoningEffort);
      localStorage.setItem(SYSTEM_PROMPT_KEY, systemPrompt);
      if (maxCompletionTokens === null) {
        localStorage.removeItem(MAX_COMPLETION_TOKENS_KEY);
      } else {
        localStorage.setItem(MAX_COMPLETION_TOKENS_KEY, String(maxCompletionTokens));
      }
      updateTopbar();
    }
    closeSettings({ force: true });
  }

  function loadMessages() {
    try {
      const data = JSON.parse(localStorage.getItem(CHAT_KEY) || "[]");
      if (!Array.isArray(data)) return [];
      return data.filter((item) =>
        (item?.role === "user" || item?.role === "assistant") &&
        typeof item.content === "string"
      );
    } catch {
      return [];
    }
  }

  function saveMessages() {
    localStorage.setItem(CHAT_KEY, JSON.stringify(messages));
    clearChatBtn.disabled = messages.length === 0;
  }

  function restoreMessages() {
    if (!messages.length) return;
    messages.forEach((item) => addBubble(item.role, item.content));
    clearChatBtn.disabled = false;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(role, text) {
    if (hintEl) hintEl.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollToBottom();
    return el;
  }

  function addReasoningBlock({ webSearch }) {
    if (hintEl) hintEl.remove();
    const root = document.createElement("div");
    root.className = "reasoning is-open";

    const toggle = document.createElement("button");
    toggle.className = "reasoning-toggle";
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "true");

    const mark = document.createElement("span");
    mark.className = "reasoning-mark";
    mark.setAttribute("aria-hidden", "true");

    const title = document.createElement("span");
    title.className = "reasoning-title";
    title.textContent = webSearch ? "策划并搜索相关资料。" : "正在思考。";

    const done = document.createElement("span");
    done.className = "reasoning-done";
    done.textContent = "Done";

    const chevron = document.createElement("span");
    chevron.className = "reasoning-chevron";
    chevron.setAttribute("aria-hidden", "true");
    chevron.textContent = "⌄";

    const body = document.createElement("div");
    body.className = "reasoning-body";

    toggle.append(mark, title, done, chevron);
    root.append(toggle, body);

    if (webSearch) {
      const tools = document.createElement("div");
      tools.className = "reasoning-tools";
      const item = document.createElement("div");
      item.textContent = "联网搜索已开启";
      tools.appendChild(item);
      root.appendChild(tools);
    }

    toggle.addEventListener("click", () => {
      const open = !root.classList.contains("is-open");
      root.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
    });

    messagesEl.appendChild(root);
    scrollToBottom();

    let hasReasoning = false;
    return {
      root,
      append(delta) {
        hasReasoning = true;
        if (title.textContent === "正在思考。" || title.textContent === "策划并搜索相关资料。") {
          title.textContent = webSearch ? "策划并搜索相关资料。" : "整理思路。";
        }
        body.textContent += delta;
      },
      finish() {
        root.classList.add("is-done");
        root.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
        title.textContent = hasReasoning ? "思考完成" : "思考完成";
      },
    };
  }

  function addCitations(annotations) {
    const links = (annotations || [])
      .map((item) => item?.url_citation || item)
      .filter((item) => item?.url)
      .slice(0, 10);
    if (!links.length) return;

    const root = document.createElement("div");
    root.className = "citations";

    const toggle = document.createElement("button");
    toggle.className = "citations-toggle";
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "false");

    const summary = document.createElement("span");
    summary.textContent = `联网搜索 · 来源 ${links.length} 条`;

    const chevron = document.createElement("span");
    chevron.className = "citations-chevron";
    chevron.setAttribute("aria-hidden", "true");
    chevron.textContent = "⌄";

    const list = document.createElement("div");
    list.className = "citations-list";
    links.forEach((item) => {
      const a = document.createElement("a");
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noreferrer";
      a.textContent = item.title || new URL(item.url).hostname;
      list.appendChild(a);
    });

    toggle.append(summary, chevron);
    root.append(toggle, list);
    toggle.addEventListener("click", () => {
      const open = !root.classList.contains("is-open");
      root.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      if (open) scrollToBottom();
    });

    messagesEl.appendChild(root);
    scrollToBottom();
  }

  // 缓存状态小徽章：优先显示读取命中，其次显示本轮新写入；门槛由所选模型决定。
  function addCacheBadge(usage, modelId) {
    const details = usage?.prompt_tokens_details;
    const promptTokens = Number(usage?.prompt_tokens || 0);
    const cached = Number(details?.cached_tokens || 0);
    const written = Number(details?.cache_write_tokens || usage?.cache_write_tokens || 0);
    const isClaude = String(modelId || "").startsWith("anthropic/claude");
    if (!promptTokens || (!isClaude && !cached && !written)) return;

    const el = document.createElement("div");
    el.className = "cache-badge";
    el.title = "缓存是否生效取决于模型门槛和前缀是否保持一致";
    const num = document.createElement("span");
    num.className = "num";
    if (cached > 0) {
      el.classList.add("hit");
      num.textContent = `${cached.toLocaleString()} / ${promptTokens.toLocaleString()}`;
      el.append("缓存命中 ", num);
    } else if (written > 0) {
      el.classList.add("write");
      num.textContent = written.toLocaleString();
      el.append("缓存写入 ", num);
    } else {
      num.textContent = promptTokens.toLocaleString();
      el.append("本轮未命中 · 输入 ", num);
    }
    messagesEl.appendChild(el);
  }

  function textFromReasoningDetails(details) {
    if (!Array.isArray(details)) return "";
    return details
      .map((item) => item?.text || item?.summary || item?.content || "")
      .filter(Boolean)
      .join("\n");
  }

  // 解析 SSE 流，每收到一段文字就回调 callbacks，返回完整正文和来源
  async function readStream(body, callbacks) {
    const reader = body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    const annotations = [];
    let usage = null;                             // OpenRouter 在最后一个数据块里附带 token 账单
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();                       // 最后一行可能不完整，留到下次
      for (const line of lines) {
        const t = line.trim();
        if (!t || t.startsWith(":")) continue;    // 跳过空行和注释（如 OpenRouter 的心跳）
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (data === "[DONE]") return { full, annotations, usage };
        try {
          const obj = JSON.parse(data);
          if (obj.usage) usage = obj.usage;
          const delta = obj.choices?.[0]?.delta || {};
          const reasoning = delta.reasoning || delta.reasoning_content || textFromReasoningDetails(delta.reasoning_details);
          if (reasoning) callbacks.onReasoning(reasoning);
          if (Array.isArray(delta.annotations)) annotations.push(...delta.annotations);
          if (delta.content) {
            full += delta.content;
            callbacks.onContent(delta.content);
          }
        } catch { /* 半截 JSON，忽略 */ }
      }
    }
    return { full, annotations, usage };
  }

  // ===== 发送 =====
  async function send() {
    const text = input.value.trim();
    if (!text || pending) return;
    const requestModel = currentModel;
    const requestEffort = normalizeEffortForModel(reasoningEffort, modelById(requestModel));
    const requestMessages = systemPrompt.trim()
      ? [{ role: "system", content: systemPrompt.trim() }, ...messages, { role: "user", content: text }]
      : [...messages, { role: "user", content: text }];

    input.value = "";
    input.style.height = "auto";
    addBubble("user", text);
    messages.push({ role: "user", content: text });
    saveMessages();

    pending = true;
    sendBtn.disabled = true;
    const reasoningBox = requestEffort !== "off" ? addReasoningBlock({ webSearch: webSearchEnabled }) : null;
    const bubble = addBubble("assistant", "");
    bubble.classList.add("typing");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: requestMessages,
          model: requestModel,
          password: accessPw,
          reasoningEffort: requestEffort,
          session_id: sessionId,
          webSearch: webSearchEnabled,
          ...(maxCompletionTokens === null ? {} : { maxCompletionTokens }),
        }),
      });

      // 密码错误：清掉本地密码，待会弹回密码界面
      if (res.status === 401) {
        const e = new Error("访问密码错误");
        e.code = 401;
        throw e;
      }
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`服务返回 ${res.status}：${errText.slice(0, 300)}`);
      }
      // 正常应是 SSE 流；若不是，多半是 JSON 错误体
      if (!(res.headers.get("Content-Type") || "").includes("text/event-stream")) {
        const data = await res.json().catch(() => null);
        const msg = data?.error?.message || data?.error || "返回了非流式响应";
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }

      const { full, annotations, usage } = await readStream(res.body, {
        onReasoning(delta) {
          if (!reasoningBox) return;
          reasoningBox.append(delta);
          scrollToBottom();
        },
        onContent(delta) {
          bubble.classList.remove("typing");
          bubble.textContent += delta;
          scrollToBottom();
        },
      });

      bubble.classList.remove("typing");
      reasoningBox?.finish();
      if (full) {
        messages.push({ role: "assistant", content: full });
        saveMessages();
        addCitations(annotations);
        addCacheBadge(usage, requestModel);
      } else {
        bubble.classList.add("error");
        bubble.textContent = "⚠️ 没有收到回复内容";
      }
    } catch (err) {
      reasoningBox?.finish();
      bubble.classList.remove("typing");
      bubble.classList.add("error");
      bubble.textContent = "⚠️ " + err.message;
      if (err.code === 401) {
        localStorage.removeItem(PW_KEY);
        accessPw = "";
        messages.pop();                 // 回滚这条没发成功的消息
        saveMessages();
        showGate("密码错误，请重新输入");
      }
    } finally {
      pending = false;
      sendBtn.disabled = false;
      scrollToBottom();
    }
  }

  // ===== 交互绑定 =====
  composer.addEventListener("submit", (e) => {
    e.preventDefault();
    send();
  });

  // 输入框随内容自动长高
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  // 桌面端：回车发送、Shift+回车换行；触屏设备保持回车换行，靠按钮发送
  const isTouch = window.matchMedia("(pointer: coarse)").matches;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !isTouch) {
      e.preventDefault();
      send();
    }
  });

  // ===== 访问密码界面 =====
  function showGate(msg) {
    gate.style.display = "flex";
    gateErr.textContent = msg || "";
    gateInput.focus();
  }
  function hideGate() {
    gate.style.display = "none";
    input.focus();
  }
  function submitGate() {
    const v = gateInput.value.trim();
    if (!v) return;
    accessPw = v;
    localStorage.setItem(PW_KEY, v);
    gateInput.value = "";
    hideGate();
  }
  gateBtn.addEventListener("click", submitGate);
  gateInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submitGate(); }
  });

  modelQuick.addEventListener("click", openQuickPanel);
  quickSettings.addEventListener("click", openSettings);
  settingsOpen.addEventListener("click", openSettings);
  settingsBack.addEventListener("click", () => closeSettings());
  settingsSave.addEventListener("click", saveSettings);
  settingsModelOpen.addEventListener("click", openModelScreen);
  settingsPromptOpen.addEventListener("click", openPromptScreen);
  modelBack.addEventListener("click", closeModelScreen);
  promptBack.addEventListener("click", closePromptScreen);
  modelSearch.addEventListener("input", renderModelList);
  modelsRetry.addEventListener("click", () => void fetchModels({ force: true }));
  modelScroll.addEventListener("scroll", updateModelScrollTop, { passive: true });
  modelsScrollTop.addEventListener("click", scrollModelsToTop);
  systemPromptInput.addEventListener("input", () => {
    autoGrowSystemPrompt();
    updatePromptCount();
  });
  maxCompletionTokensInput.addEventListener("input", () => {
    draftMaxCompletionTokens = maxCompletionTokensInput.value.trim();
    updateSettingsDirty();
  });
  maxCompletionTokensInput.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
    event.preventDefault();
    stepMaxCompletionTokens(event.key === "ArrowUp" ? 1 : -1);
  });
  maxTokensDown.addEventListener("click", () => stepMaxCompletionTokens(-1));
  maxTokensUp.addEventListener("click", () => stepMaxCompletionTokens(1));
  webToggle.addEventListener("click", () => {
    webSearchEnabled = !webSearchEnabled;
    localStorage.setItem(WEB_KEY, webSearchEnabled ? "1" : "0");
    updateTopbar();
  });
  document.addEventListener("click", (event) => {
    if (!event.composedPath().includes(document.querySelector(".model-control"))) {
      closeQuickPanel();
    }
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (modelScreen.classList.contains("is-open")) {
      closeModelScreen({ instant: true });
    } else if (promptScreen.classList.contains("is-open")) {
      closePromptScreen({ instant: true });
    } else if (settingsScreen.classList.contains("is-open")) {
      closeSettings({ instant: true });
    } else if (quickPanel.classList.contains("is-open")) {
      closeQuickPanel();
      modelQuick.focus();
    }
  });
  clearChatBtn.addEventListener("click", () => {
    messages.length = 0;
    localStorage.removeItem(CHAT_KEY);
    sessionId = createSessionId();
    localStorage.setItem(SESSION_KEY, sessionId);
    messagesEl.textContent = "";
    messagesEl.appendChild(hintEl);
    clearChatBtn.disabled = true;
    input.focus();
  });
  updateTopbar();
  restoreMessages();

  // 没存过密码就先弹密码界面（密码不写在代码里，由你打开时手输一次）
  if (!accessPw) showGate();
</script>
</body>
</html>
