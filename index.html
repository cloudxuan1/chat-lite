  function normalizeDisplayName(value, fallback) {
    const normalized = String(value || "")
      .replace(/[\r\n\t]+/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 30);
    return normalized || fallback;
  }

  function normalizeExportFileName(value) {
    return String(value || "")
      .replace(/[\r\n\t]+/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 80);
  }

  function safeExportFileBase(value) {
    return normalizeExportFileName(value)
      .replace(/\.md$/i, "")
      .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "-")
      .replace(/^[.\s]+/g, "")
      .replace(/[.\s]+$/g, "")
      .trim();
  }

  function defaultExportFileBase() {
    const parts = new Intl.DateTimeFormat("zh-CN", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    }).formatToParts(new Date());
    const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
    return `chat-lite-${values.year}-${values.month}-${values.day}-${values.hour}-${values.minute}`;
  }

  function loadReasoningEffort() {
    const saved = localStorage.getItem(REASONING_EFFORT_KEY);
    if (EFFORT_OPTIONS.some((item) => item.value === saved)) return saved;
    return localStorage.getItem(LEGACY_REASONING_KEY) === "0" ? "off" : "medium";
  }

  function loadMaxCompletionTokens() {
    const saved = localStorage.getItem(MAX_COMPLETION_TOKENS_KEY);
    if (saved === null || saved === "") return null;
    const value = Number(saved);
    return Number.isInteger(value) && value > 0 ? value : null;
  }

  function createSessionId() {
    if (typeof crypto?.randomUUID === "function") return crypto.randomUUID();
    return `chat-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
  }

  function createConversationId() {
    if (typeof crypto?.randomUUID === "function") return `conversation-${crypto.randomUUID()}`;
    return `conversation-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
  }

  function visibleCharacters(value) {
    const text = String(value || "");
    if (typeof Intl?.Segmenter === "function") {
      return Array.from(new Intl.Segmenter("zh-CN", { granularity: "grapheme" }).segment(text), (item) => item.segment);
    }
    return Array.from(text);
  }

  function normalizeConversationTitle(value) {
    const normalized = String(value || "")
      .replace(/[\r\n\t]+/g, " ")
      .replace(/\s+/g, " ")
      .replace(/[\p{Extended_Pictographic}\p{Emoji_Modifier}\uFE0E\uFE0F\u200D]/gu, "")
      .replace(/^[\s"'“”‘’「」『』《》【】]+|[\s"'“”‘’「」『』《》【】]+$/gu, "")
      .replace(/\s+/g, " ")
      .trim();
    const title = visibleCharacters(normalized)
      .slice(0, CONVERSATION_TITLE_MAX_CHARACTERS)
      .join("")
      .trim();
    return /[\p{L}\p{N}]/u.test(title) ? title : "";
  }

  function titleFromFirstMessage(messages) {
    const firstUser = messages.find((item) => item.role === "user" && item.content.trim());
    return normalizeConversationTitle(firstUser?.content) || "新对话";
  }

  function normalizeStoredMessages(items) {
    if (!Array.isArray(items)) return [];
    return items.filter((item) =>
      (item?.role === "user" || item?.role === "assistant") &&
      typeof item.content === "string"
    ).map((item) => ({ role: item.role, content: item.content }));
  }

  function validStoredDate(value, fallback) {
    return typeof value === "string" && Number.isFinite(Date.parse(value))
      ? value
      : fallback;
  }

  function createConversation({ messages = [], sessionId = "", createdAt = new Date().toISOString() } = {}) {
    const safeMessages = normalizeStoredMessages(messages);
    const title = titleFromFirstMessage(safeMessages);
    return {
      id: createConversationId(),
      title,
      titleSource: title === "新对话" ? "default" : "fallback",
      messages: safeMessages,
      sessionId: sessionId && sessionId.length <= 256 ? sessionId : createSessionId(),
      createdAt,
      updatedAt: createdAt,
    };
  }

  function isRecoverableConversationStore(value) {
    return Boolean(
      value &&
      typeof value === "object" &&
      !Array.isArray(value) &&
      value.version === 1 &&
      Array.isArray(value.conversations) &&
      value.conversations.some((item) =>
        item &&
        typeof item === "object" &&
        !Array.isArray(item) &&
        Array.isArray(item.messages)
      )
    );
  }

  function preserveCorruptConversationStore(rawValue) {
    if (!rawValue) return true;
    conversationStoreRecoveryRaw = rawValue;
    try {
      if (localStorage.getItem(CORRUPT_CONVERSATIONS_BACKUP_KEY) !== rawValue) {
        localStorage.setItem(CORRUPT_CONVERSATIONS_BACKUP_KEY, rawValue);
      }
      return localStorage.getItem(CORRUPT_CONVERSATIONS_BACKUP_KEY) === rawValue;
    } catch {
      return false;
    }
  }

  function normalizeConversationStore(value) {
    const source = value && typeof value === "object" ? value : {};
    const seenIds = new Set();
    const seenSessions = new Set();
    const now = new Date().toISOString();
    const titleSources = new Set(["default", "fallback", "deepseek", "manual"]);
    const conversations = [];

    for (const item of Array.isArray(source.conversations) ? source.conversations : []) {
      if (!item || typeof item !== "object" || !Array.isArray(item.messages)) continue;
      const messages = normalizeStoredMessages(item?.messages);
      let id = typeof item?.id === "string" &&
        item.id.trim().length <= 160 &&
        /^[A-Za-z0-9._:-]+$/.test(item.id.trim())
        ? item.id.trim()
        : "";
      if (!id || seenIds.has(id)) id = createConversationId();
      seenIds.add(id);

      let sessionId = typeof item?.sessionId === "string" && item.sessionId.trim().length <= 256
        ? item.sessionId.trim()
        : "";
      if (!sessionId || seenSessions.has(sessionId)) sessionId = createSessionId();
      seenSessions.add(sessionId);

      const createdAt = validStoredDate(item?.createdAt, now);
      const updatedAt = validStoredDate(item?.updatedAt, createdAt);
      const fallbackTitle = titleFromFirstMessage(messages);
      const title = normalizeConversationTitle(item?.title) || fallbackTitle;
      const titleSource = titleSources.has(item?.titleSource)
        ? item.titleSource
        : title === "新对话" ? "default" : "fallback";

      conversations.push({
        id,
        title,
        titleSource,
        messages,
        sessionId,
        createdAt,
        updatedAt,
      });
    }

    if (!conversations.length) conversations.push(createConversation());
    const activeId = conversations.some((item) => item.id === source.activeId)
      ? source.activeId
      : conversations[0].id;
    return { version: 1, activeId, conversations };
  }

  function loadLegacyMessages() {
    try {
      return normalizeStoredMessages(JSON.parse(localStorage.getItem(LEGACY_CHAT_KEY) || "[]"));
    } catch {
      return [];
    }
  }

  function loadLegacySessionId() {
    const saved = localStorage.getItem(LEGACY_SESSION_KEY);
    return saved && saved.length <= 256 ? saved : createSessionId();
  }

  function loadConversationStore() {
    const stored = localStorage.getItem(CONVERSATIONS_KEY);
    let mayReplaceStoredValue = !stored;
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        if (isRecoverableConversationStore(parsed)) {
          const normalized = normalizeConversationStore(parsed);
          const isCanonical = JSON.stringify(parsed) === JSON.stringify(normalized);
          const mayReplaceNormalizedValue = isCanonical ||
            preserveCorruptConversationStore(stored);
          if (!isCanonical) {
            conversationStoreLoadWarning = mayReplaceNormalizedValue
              ? "检测到部分损坏的会话索引；可恢复会话已保留，原数据已留作本机备份。"
              : "检测到部分损坏的会话索引；为避免覆盖原数据，本次更改暂不能保存。";
          }
          if (mayReplaceNormalizedValue) {
            try {
              localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(normalized));
            } catch {
              conversationStoreLoadWarning = "本地存储已满；刷新前请先下载或删除旧会话。";
            }
          }
          return normalized;
        }
      } catch {
        // 继续走下方的旧版历史恢复。
      }
      mayReplaceStoredValue = preserveCorruptConversationStore(stored);
      conversationStoreLoadWarning = mayReplaceStoredValue
        ? "检测到损坏的会话索引；旧历史已恢复，原数据已留作本机备份。"
        : "检测到损坏的会话索引；为避免覆盖原数据，本次更改暂不能保存。";
    }

    const migrated = normalizeConversationStore({
      version: 1,
      conversations: [createConversation({
        messages: loadLegacyMessages(),
        sessionId: loadLegacySessionId(),
      })],
    });
    migrated.activeId = migrated.conversations[0].id;
    if (mayReplaceStoredValue) {
      try {
        localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(migrated));
      } catch {
        conversationStoreLoadWarning = "暂时无法保存会话索引；旧版历史仍保留在本机。";
      }
    }
    return migrated;
  }

  function cloneConversationStore() {
    return JSON.parse(JSON.stringify(conversationStore));
  }

  function getActiveConversation(store = conversationStore) {
    return store.conversations.find((item) => item.id === store.activeId) || store.conversations[0];
  }

  function conversationById(conversationId, store = conversationStore) {
    return store.conversations.find((item) => item.id === conversationId) || null;
  }

  function persistConversationStore(nextStore, { keepInMemoryOnFailure = false } = {}) {
    const normalized = normalizeConversationStore(nextStore);
    if (
      conversationStoreRecoveryRaw &&
      !preserveCorruptConversationStore(conversationStoreRecoveryRaw)
    ) {
      showAppStatus("本地存储空间不足，无法备份损坏数据；为避免覆盖，暂未保存这次更改。");
      return false;
    }
    try {
      localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(normalized));
      conversationStore = normalized;
      conversationStoreRecoveryRaw = "";
      showAppStatus("");
      return true;
    } catch {
      if (keepInMemoryOnFailure) conversationStore = normalized;
      showAppStatus("本地存储已满，请先下载或删除旧会话。");
      return false;
    }
  }

  function normalizeFavorites(items) {
    if (!Array.isArray(items)) return [];
    const seen = new Set();
    const normalized = [];
    for (const item of items) {
      const id = String(item?.id || item || "").trim();
      const label = String(item?.label || "").trim();
      if (!id || seen.has(id)) continue;
      seen.add(id);
      normalized.push({ id, label: label || friendlyModelName(id) });
    }
    return normalized;
  }

  function loadFavorites() {
    const saved = normalizeFavorites(parseStoredJson(FAVORITES_KEY, []));
    return saved.length ? saved : [{ id: currentModel || DEFAULT_MODEL, label: friendlyModelName(currentModel || DEFAULT_MODEL) }];
  }

  function normalizeModel(item) {
    const id = String(item?.id || "").trim();
    if (!id) return null;
    return {
      id,
      name: String(item?.name || "").trim(),
      description: String(item?.description || "").trim().slice(0, 600),
      contextLength: Number(item?.contextLength || 0) || null,
      maxCompletionTokens: Number(item?.maxCompletionTokens || 0) || null,
      pricing: item?.pricing && typeof item.pricing === "object" ? item.pricing : null,
      reasoning: item?.reasoning && typeof item.reasoning === "object" ? item.reasoning : null,
      supportedParameters: Array.isArray(item?.supportedParameters) ? item.supportedParameters : [],
    };
  }

  function loadModelCatalog() {
    const items = parseStoredJson(MODEL_CATALOG_KEY, []);
    if (!Array.isArray(items)) return [];
    return items.map(normalizeModel).filter(Boolean);
  }

  function saveModelCatalog(items) {
    const safe = items.map(normalizeModel).filter(Boolean);
    fetchedModels = safe;
    try {
      localStorage.setItem(MODEL_CATALOG_KEY, JSON.stringify(safe));
    } catch {
      // 模型目录只是离线备用，浏览器空间不足时不影响聊天和收藏。
    }
  }

  function friendlyModelName(modelId) {
    let slug = String(modelId || DEFAULT_MODEL).split("/").pop() || "";
    slug = slug.replace(/:[^:]+$/, "").replace(/^claude-/i, "");
    slug = slug
      .replace(/^gpt-/i, "GPT ")
      .replace(/^gemini-/i, "Gemini ")
      .replace(/^grok-/i, "Grok ")
      .replace(/^deepseek-/i, "DeepSeek ")
      .replace(/^qwen-/i, "Qwen ")
      .replace(/-/g, " ")
      .replace(/\b(opus|sonnet|haiku|pro|flash|mini|max)\b/gi, (word) =>
        word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
      )
      .replace(/\s+/g, " ")
      .trim();
    return slug || "当前模型";
  }

  function modelById(modelId) {
    return fetchedModels.find((item) => item.id === modelId) || null;
  }

  function modelLabel(modelId) {
    const model = modelById(modelId);
    return friendlyModelName(model?.id || modelId);
  }

  function effortAllowed(model, value) {
    const reasoning = model?.reasoning;
    if (value === "off") return reasoning?.mandatory !== true;
    const supported = reasoning?.supported_efforts;
    if (Array.isArray(supported) && supported.length) return supported.includes(value);
    if (model && model.supportedParameters.length && !model.supportedParameters.includes("reasoning")) {
      return false;
    }
    return true;
  }

  function normalizeEffortForModel(value, model) {
    if (effortAllowed(model, value)) return value;
    const supported = model?.reasoning?.supported_efforts;
    const preferred = model?.reasoning?.default_effort;
    if (preferred && EFFORT_OPTIONS.some((item) => item.value === preferred) && effortAllowed(model, preferred)) {
      return preferred;
    }
    if (Array.isArray(supported)) {
      for (const option of ["medium", "low", "high"]) {
        if (supported.includes(option)) return option;
      }
    }
    return model?.reasoning?.mandatory ? "medium" : "off";
  }

  function renderEffortOptions(container, selected, model, onSelect) {
    container.replaceChildren();
    EFFORT_OPTIONS.forEach((option) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "effort-option";
      button.textContent = option.label;
      button.dataset.effort = option.value;
      button.disabled = !effortAllowed(model, option.value);
      button.setAttribute("aria-pressed", String(option.value === selected));
      button.addEventListener("click", () => onSelect(option.value));
      container.appendChild(button);
    });
  }

  function updateTopbar() {
    modelQuickLabel.textContent = modelLabel(currentModel);
    quickModelId.textContent = currentModel;
    const model = modelById(currentModel);
    renderEffortOptions(quickEffortOptions, reasoningEffort, model, setQuickEffort);
    webToggle.setAttribute("aria-pressed", String(webSearchEnabled));
    webState.textContent = webSearchEnabled ? "开" : "关";
  }

  function setQuickEffort(value) {
    reasoningEffort = normalizeEffortForModel(value, modelById(currentModel));
    localStorage.setItem(REASONING_EFFORT_KEY, reasoningEffort);
    updateTopbar();
  }

  function settingsState() {
    return JSON.stringify({
      model: draftModel,
      reasoningEffort: draftReasoningEffort,
      systemPrompt: systemPromptInput.value,
      maxCompletionTokens: draftMaxCompletionTokens,
      userDisplayName: userDisplayNameInput.value,
      assistantDisplayName: assistantDisplayNameInput.value,
      exportFileName: exportFileNameInput.value,
    });
  }

  function maxTokensValidationMessage() {
    const raw = draftMaxCompletionTokens.trim();
    if (!raw) return "";
    if (!/^\d+$/.test(raw) || !Number.isSafeInteger(Number(raw)) || Number(raw) < 1) {
      return "请输入大于 0 的整数，或留空使用自动。";
    }
    const modelMax = modelById(draftModel)?.maxCompletionTokens;
    if (modelMax && Number(raw) > modelMax) {
      return `当前模型最多支持 ${modelMax.toLocaleString()} token。`;
    }
    return "";
  }

  function updateMaxTokensUi() {
    const modelMax = modelById(draftModel)?.maxCompletionTokens;
    maxTokensNote.textContent = modelMax
      ? `包含内部思考；留空为自动 · 当前模型最多 ${modelMax.toLocaleString()}`
      : "包含内部思考；留空为自动";
    const message = maxTokensValidationMessage();
    maxTokensError.textContent = message;
    maxCompletionTokensInput.setAttribute("aria-invalid", String(Boolean(message)));
    settingsSave.disabled = Boolean(message);
    return !message;
  }

  function updateSettingsDirty() {
    settingsSave.textContent = "保存并返回";
    updateMaxTokensUi();
  }

  function updatePromptCount() {
    const length = systemPromptInput.value.length;
    promptCount.textContent = `${length.toLocaleString()} 字`;
    settingsPromptSummary.textContent = systemPromptInput.value.trim()
      ? `已设置 · ${length.toLocaleString()} 字`
      : "未设置";
    updateSettingsDirty();
  }

  function updateIdentitySummary() {
    draftUserDisplayName = normalizeDisplayName(userDisplayNameInput.value, "你");
    draftAssistantDisplayName = normalizeDisplayName(assistantDisplayNameInput.value, "助手");
    draftExportFileName = normalizeExportFileName(exportFileNameInput.value);
    const fileSummary = draftExportFileName ? "自定义文件名" : "自动命名";
    settingsIdentitySummary.textContent = `${draftUserDisplayName} / ${draftAssistantDisplayName} · ${fileSummary}`;
    updateSettingsDirty();
  }

  function autoGrowSystemPrompt() {
    systemPromptInput.style.height = "auto";
    systemPromptInput.style.height = `${Math.max(systemPromptInput.scrollHeight, 220)}px`;
  }

  function stepMaxCompletionTokens(direction) {
    const raw = draftMaxCompletionTokens.trim();
    const current = /^\d+$/.test(raw) ? Number(raw) : 0;
    const next = direction > 0 ? current + 1024 : current - 1024;
    draftMaxCompletionTokens = next > 0 ? String(next) : "";
    maxCompletionTokensInput.value = draftMaxCompletionTokens;
    updateSettingsDirty();
  }

  function updateSettingsModel() {
    const model = modelById(draftModel);
    settingsModelName.textContent = modelLabel(draftModel);
    settingsModelId.textContent = draftModel;
    draftReasoningEffort = normalizeEffortForModel(draftReasoningEffort, model);
    renderEffortOptions(settingsEffortOptions, draftReasoningEffort, model, (value) => {
      draftReasoningEffort = normalizeEffortForModel(value, model);
      updateSettingsModel();
      updateSettingsDirty();
    });
    if (model?.reasoning?.mandatory) {
      reasoningNote.textContent = "这个模型必须推理，不能关闭；这里只显示它支持的档位。";
    } else if (model && model.supportedParameters.length && !model.supportedParameters.includes("reasoning")) {
      reasoningNote.textContent = "这个模型没有提供可调推理程度，发送时会关闭推理。";
    } else {
      reasoningNote.textContent = "越高越适合复杂问题，也会花更多时间和 token。";
    }
    updateMaxTokensUi();
  }

  function collectVisibleModels() {
    const query = modelSearch.value.trim().toLowerCase();
    const favoriteIds = new Set(draftFavorites.map((item) => item.id));
    const byId = new Map();
    for (const favorite of draftFavorites) {
      const fetched = modelById(favorite.id);
      byId.set(favorite.id, fetched || normalizeModel({ id: favorite.id, name: favorite.label }));
    }
    for (const model of fetchedModels) byId.set(model.id, model);
    if (!byId.has(draftModel)) byId.set(draftModel, normalizeModel({ id: draftModel }));
    const matches = (model) => {
      if (!query) return true;
      return `${model.id} ${model.name} ${model.description}`.toLowerCase().includes(query);
    };
    const favorites = [...byId.values()].filter((model) => favoriteIds.has(model.id) && matches(model));
    const others = [...byId.values()].filter((model) => !favoriteIds.has(model.id) && matches(model));
    return { favorites, others };
  }

  function makeStarIcon() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path></svg>';
  }

  function appendModelGroup(label, models) {
    if (!models.length) return;
    const heading = document.createElement("div");
    heading.className = "model-group-label";
    heading.textContent = label;
    modelList.appendChild(heading);
    for (const model of models) {
      const row = document.createElement("div");
      row.className = "model-choice" + (model.id === draftModel ? " active" : "");

      const text = document.createElement("span");
      text.className = "model-choice-text";
      const name = document.createElement("strong");
      name.className = "model-choice-name";
      name.textContent = friendlyModelName(model.id);
      const id = document.createElement("span");
      id.className = "model-choice-id";
      id.textContent = model.id;
      text.append(name, id);

      const selectButton = document.createElement("button");
      selectButton.type = "button";
      selectButton.className = "model-choice-select";
      selectButton.setAttribute("aria-pressed", String(model.id === draftModel));
      selectButton.appendChild(text);

      const favorite = draftFavorites.some((item) => item.id === model.id);
      const star = document.createElement("button");
      star.type = "button";
      star.className = "model-star";
      star.innerHTML = makeStarIcon();
      star.setAttribute("aria-label", favorite ? `取消收藏 ${name.textContent}` : `收藏 ${name.textContent}`);
      star.setAttribute("aria-pressed", String(favorite));
      star.addEventListener("click", (event) => {
        event.stopPropagation();
        if (favorite) {
          draftFavorites = draftFavorites.filter((item) => item.id !== model.id);
        } else {
          draftFavorites = normalizeFavorites([
            ...draftFavorites,
            { id: model.id, label: friendlyModelName(model.id) },
          ]);
        }
        favoriteModels = normalizeFavorites(draftFavorites);
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(favoriteModels));
        renderModelList();
      });

      const select = () => {
        draftModel = model.id;
        draftReasoningEffort = normalizeEffortForModel(draftReasoningEffort, model);
        updateSettingsModel();
        renderModelList();
        updateSettingsDirty();
      };
      selectButton.addEventListener("click", select);
      row.append(selectButton, star);
      modelList.appendChild(row);
    }
  }

  function renderModelList() {
    modelList.replaceChildren();
    const { favorites, others } = collectVisibleModels();
    appendModelGroup("收藏模型", favorites);
    appendModelGroup(modelSearch.value.trim() ? "搜索结果" : "全部模型", others);
    if (!favorites.length && !others.length) {
      const empty = document.createElement("div");
      empty.className = "model-group-label";
      empty.textContent = modelsLoading ? "正在拉取模型…" : "没有找到模型";
      modelList.appendChild(empty);
    }
  }

  async function fetchModels({ force = false } = {}) {
    if (modelsLoading || (modelsLoadedThisPage && !force)) return;
    modelsLoading = true;
    modelsStatus.textContent = "正在从 OpenRouter 拉取模型…";
    modelsRetry.disabled = true;
    renderModelList();
    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "models", password: accessPw }),
      });
      if (response.status === 401) {
        localStorage.removeItem(PW_KEY);
        accessPw = "";
        showGate("密码已失效，请重新输入");
        throw new Error("需要重新输入访问密码");
      }
      const payload = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error(payload?.error || `服务返回 ${response.status}`);
      }
      const models = Array.isArray(payload?.models) ? payload.models : [];
      saveModelCatalog(models);
      modelsLoadedThisPage = true;
      modelsStatus.textContent = `已拉取 ${fetchedModels.length.toLocaleString()} 个模型`;
      updateSettingsModel();
    } catch (error) {
      modelsStatus.textContent = `拉取失败：${error.message}。已保留本地模型，可点右侧重试。`;
    } finally {
      modelsLoading = false;
      modelsRetry.disabled = false;
      renderModelList();
    }
  }

  function openQuickPanel() {
    const open = !quickPanel.classList.contains("is-open");
    quickPanel.classList.toggle("is-open", open);
    quickPanel.setAttribute("aria-hidden", String(!open));
    modelQuick.setAttribute("aria-expanded", String(open));
  }

  function closeQuickPanel() {
    quickPanel.classList.remove("is-open");
    quickPanel.setAttribute("aria-hidden", "true");
    modelQuick.setAttribute("aria-expanded", "false");
  }

  function openSettings() {
    settingsTrigger = document.activeElement;
    closeQuickPanel();
    draftModel = currentModel;
    draftFavorites = favoriteModels.map((item) => ({ ...item }));
    draftReasoningEffort = reasoningEffort;
    draftMaxCompletionTokens = maxCompletionTokens === null ? "" : String(maxCompletionTokens);
    draftUserDisplayName = userDisplayName;
    draftAssistantDisplayName = assistantDisplayName;
    draftExportFileName = exportFileName;
    modelSearch.value = "";
    systemPromptInput.value = systemPrompt;
    maxCompletionTokensInput.value = draftMaxCompletionTokens;
    userDisplayNameInput.value = draftUserDisplayName;
    assistantDisplayNameInput.value = draftAssistantDisplayName;
    exportFileNameInput.value = draftExportFileName;
    updateSettingsModel();
    renderModelList();
    updatePromptCount();
    updateIdentitySummary();
    settingsSnapshot = settingsState();
    updateSettingsDirty();
    settingsScreen.classList.add("is-open");
    settingsScreen.setAttribute("aria-hidden", "false");
    syncInteractionState();
    settingsBack.focus();
    requestAnimationFrame(autoGrowSystemPrompt);
  }

  function openModelScreen() {
    settingsScreen.inert = true;
    modelScreen.classList.add("is-open");
    modelScreen.setAttribute("aria-hidden", "false");
    modelScroll.scrollTop = 0;
    modelSearch.value = "";
    renderModelList();
    modelsStatus.textContent = fetchedModels.length
      ? `本地已有 ${fetchedModels.length.toLocaleString()} 个模型，正在刷新…`
      : "准备拉取 OpenRouter 模型…";
    modelBack.focus();
    updateModelScrollTop();
    void fetchModels({ force: true });
  }

  function skipPanelMotionOnce(screen) {
    screen.classList.add("skip-motion");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      screen.classList.remove("skip-motion");
    }));
  }

  function closeModelScreen({ instant = false } = {}) {
    if (instant) skipPanelMotionOnce(modelScreen);
    modelScreen.classList.remove("is-open");
    modelScreen.setAttribute("aria-hidden", "true");
    settingsScreen.inert = false;
    settingsModelOpen.focus();
  }

  function openPromptScreen() {
    settingsScreen.inert = true;
    promptScreen.classList.add("is-open");
    promptScreen.setAttribute("aria-hidden", "false");
    promptScroll.scrollTop = 0;
    promptBack.focus();
    requestAnimationFrame(autoGrowSystemPrompt);
  }

  function closePromptScreen({ instant = false } = {}) {
    if (instant) skipPanelMotionOnce(promptScreen);
    promptScreen.classList.remove("is-open");
    promptScreen.setAttribute("aria-hidden", "true");
    settingsScreen.inert = false;
    updatePromptCount();
    settingsPromptOpen.focus();
  }

  function openIdentityScreen() {
    settingsScreen.inert = true;
    identityScreen.classList.add("is-open");
    identityScreen.setAttribute("aria-hidden", "false");
    identityBack.focus();
  }

  function closeIdentityScreen({ instant = false } = {}) {
    if (instant) skipPanelMotionOnce(identityScreen);
    identityScreen.classList.remove("is-open");
    identityScreen.setAttribute("aria-hidden", "true");
    settingsScreen.inert = false;
    updateIdentitySummary();
    settingsIdentityOpen.focus();
  }

  function updateModelScrollTop() {
    const visible = modelScroll.scrollTop > 360;
    modelsScrollTop.classList.toggle("is-visible", visible);
  }

  function scrollModelsToTop() {
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    modelScroll.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
  }

  function closeSettings({ force = false, instant = false } = {}) {
    if (!force && settingsState() !== settingsSnapshot && !window.confirm("放弃还没保存的设置？")) {
      return;
    }
    modelScreen.classList.remove("is-open");
    modelScreen.setAttribute("aria-hidden", "true");
    promptScreen.classList.remove("is-open");
    promptScreen.setAttribute("aria-hidden", "true");
    identityScreen.classList.remove("is-open");
    identityScreen.setAttribute("aria-hidden", "true");
    settingsScreen.inert = false;
    if (instant) skipPanelMotionOnce(settingsScreen);
    settingsScreen.classList.remove("is-open");
    settingsScreen.setAttribute("aria-hidden", "true");
    syncInteractionState();
    const returnTarget = settingsTrigger;
    settingsTrigger = null;
    if (returnTarget instanceof HTMLElement) returnTarget.focus();
  }

  function saveSettings() {
    if (!updateMaxTokensUi()) {
      maxCompletionTokensInput.focus();
      return;
    }
    if (settingsState() !== settingsSnapshot) {
      currentModel = draftModel || DEFAULT_MODEL;
      favoriteModels = normalizeFavorites(draftFavorites);
      reasoningEffort = draftReasoningEffort;
      systemPrompt = systemPromptInput.value.trim();
      maxCompletionTokens = draftMaxCompletionTokens
        ? Number(draftMaxCompletionTokens)
        : null;
      userDisplayName = normalizeDisplayName(userDisplayNameInput.value, "你");
      assistantDisplayName = normalizeDisplayName(assistantDisplayNameInput.value, "助手");
      exportFileName = normalizeExportFileName(exportFileNameInput.value);
      localStorage.setItem(MODEL_KEY, currentModel);
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favoriteModels));
      localStorage.setItem(REASONING_EFFORT_KEY, reasoningEffort);
      localStorage.setItem(SYSTEM_PROMPT_KEY, systemPrompt);
      localStorage.setItem(USER_NAME_KEY, userDisplayName);
      localStorage.setItem(ASSISTANT_NAME_KEY, assistantDisplayName);
      if (exportFileName) {
        localStorage.setItem(EXPORT_FILE_NAME_KEY, exportFileName);
      } else {
        localStorage.removeItem(EXPORT_FILE_NAME_KEY);
      }
      if (maxCompletionTokens === null) {
        localStorage.removeItem(MAX_COMPLETION_TOKENS_KEY);
      } else {
        localStorage.setItem(MAX_COMPLETION_TOKENS_KEY, String(maxCompletionTokens));
      }
      updateTopbar();
      updateMessageLabels();
    }
    closeSettings({ force: true });
  }

  function announceConversation(message) {
    conversationLive.textContent = "";
    window.requestAnimationFrame(() => {
      conversationLive.textContent = message;
    });
  }

  function showAppStatus(message) {
    appStatus.textContent = message || "";
    appStatus.classList.toggle("is-visible", Boolean(message));
  }

  function conversationPreview(conversation) {
    const latest = conversation.messages.at(-1)?.content || "";
    return latest.replace(/[\r\n\t]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function formatConversationTime(value) {
    const date = new Date(value);
    if (!Number.isFinite(date.getTime())) return "";
    const now = new Date();
    if (date.toDateString() === now.toDateString()) {
      return new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      }).format(date);
    }
    return new Intl.DateTimeFormat("zh-CN", {
      month: "numeric",
      day: "numeric",
    }).format(date);
  }

  function sortedConversations() {
    return [...conversationStore.conversations].sort(
      (a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt)
    );
  }

  function renderConversationList() {
    conversationList.replaceChildren();
    conversationNew.disabled = pending;
    conversationPendingNote.textContent = pending ? "回复完成后可切换会话" : "";

    for (const conversation of sortedConversations()) {
      const item = document.createElement("div");
      item.className = "conversation-item";
      item.dataset.conversationId = conversation.id;
      if (conversation.id === conversationStore.activeId) item.classList.add("active");

      if (renamingConversationId === conversation.id) {
        const form = document.createElement("form");
        form.className = "conversation-rename-form";
        form.dataset.conversationId = conversation.id;

        const renameInput = document.createElement("input");
        renameInput.className = "conversation-rename-input";
        renameInput.type = "text";
        renameInput.maxLength = CONVERSATION_TITLE_MAX_CHARACTERS;
        renameInput.value = conversation.title;
        renameInput.setAttribute("aria-label", "会话标题");

        const save = document.createElement("button");
        save.className = "conversation-rename-action";
        save.type = "submit";
        save.setAttribute("aria-label", "保存标题");
        save.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';

        const cancel = document.createElement("button");
        cancel.className = "conversation-rename-action";
        cancel.type = "button";
        cancel.dataset.action = "cancel-rename";
        cancel.setAttribute("aria-label", "取消重命名");
        cancel.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>';

        form.append(renameInput, save, cancel);
        item.appendChild(form);
        conversationList.appendChild(item);
        continue;
      }

      const select = document.createElement("button");
      select.className = "conversation-select";
      select.type = "button";
      select.dataset.action = "switch";
      select.dataset.conversationId = conversation.id;
      select.disabled = pending;
      if (conversation.id === conversationStore.activeId) {
        select.setAttribute("aria-current", "page");
      }

      const mark = document.createElement("span");
      mark.className = "conversation-current-mark";
      mark.setAttribute("aria-hidden", "true");

      const copy = document.createElement("span");
      copy.className = "conversation-copy";
      const title = document.createElement("span");
      title.className = "conversation-title";
      title.textContent = conversation.title;
      title.title = conversation.title;
      const meta = document.createElement("span");
      meta.className = "conversation-meta";
      const preview = conversationPreview(conversation);
      if (preview) {
        const previewEl = document.createElement("span");
        previewEl.className = "conversation-preview";
        previewEl.textContent = preview;
        meta.appendChild(previewEl);
      }
      const time = document.createElement("time");
      time.className = "conversation-time";
      time.dateTime = conversation.updatedAt;
      time.textContent = formatConversationTime(conversation.updatedAt);
      meta.appendChild(time);
      copy.append(title, meta);
      select.append(mark, copy);

      const more = document.createElement("button");
      more.className = "conversation-more";
      more.type = "button";
      more.dataset.action = "menu";
      more.dataset.conversationId = conversation.id;
      more.disabled = pending;
      more.setAttribute("aria-label", `${conversation.title}的更多操作`);
      more.setAttribute("aria-expanded", String(conversationMenuId === conversation.id));
      more.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r=".8"></circle><circle cx="12" cy="12" r=".8"></circle><circle cx="19" cy="12" r=".8"></circle></svg>';
      item.append(select, more);

      if (conversationMenuId === conversation.id) {
        const menu = document.createElement("div");
        menu.className = "conversation-menu";
        menu.setAttribute("role", "group");
        menu.setAttribute("aria-label", `${conversation.title}的操作`);
        menu.innerHTML = `
          <button class="conversation-menu-button" type="button" data-action="rename" data-conversation-id="${conversation.id}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.6-10.6-3.2-3.2L5 15.8 4 20Z"></path><path d="m13.8 7 3.2 3.2"></path></svg>
            <span>重命名</span>
          </button>
          <button class="conversation-menu-button danger" type="button" data-action="delete" data-conversation-id="${conversation.id}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="m9 7 .7-2h4.6l.7 2"></path><path d="m7 7 .7 13h8.6L17 7"></path></svg>
            <span>删除</span>
          </button>
        `;
        item.appendChild(menu);
      }
      conversationList.appendChild(item);
    }

    if (renamingConversationId) {
      window.requestAnimationFrame(() => {
        const renameInput = conversationList.querySelector(".conversation-rename-input");
        renameInput?.focus();
        renameInput?.select();
      });
    } else if (conversationMenuId) {
      window.requestAnimationFrame(() => {
        const menu = [...conversationList.querySelectorAll(".conversation-item")]
          .find((item) => item.dataset.conversationId === conversationMenuId)
          ?.querySelector(".conversation-menu");
        menu?.scrollIntoView({ block: "nearest" });
        menu?.querySelector(".conversation-menu-button")?.focus();
      });
    }
  }

  function focusConversationMore(conversationId) {
    window.requestAnimationFrame(() => {
      [...conversationList.querySelectorAll(".conversation-more")]
        .find((button) => button.dataset.conversationId === conversationId)
        ?.focus();
    });
  }

  function focusConversationSelect(conversationId) {
    window.requestAnimationFrame(() => {
      [...conversationList.querySelectorAll(".conversation-select")]
        .find((button) => button.dataset.conversationId === conversationId)
        ?.focus();
    });
  }

  function loadSidebarPreference() {
    try {
      return localStorage.getItem(SIDEBAR_OPEN_KEY) === "1";
    } catch {
      return false;
    }
  }

  function saveSidebarPreference(isOpen) {
    try {
      localStorage.setItem(SIDEBAR_OPEN_KEY, isOpen ? "1" : "0");
    } catch {
      // 侧栏偏好是可选项，失败不应阻断打开/关闭。
    }
  }

  function updateConversationActionState() {
    const empty = getActiveConversation().messages.length === 0;
    clearChatBtn.disabled = pending || empty;
    exportChatBtn.disabled = pending || empty;
    sendBtn.disabled = pending;
  }

  function setPending(value) {
    pending = value;
    if (value) {
      conversationMenuId = null;
      renamingConversationId = null;
    }
    updateConversationActionState();
    renderConversationList();
  }

  function renderActiveConversation() {
    messagesEl.replaceChildren();
    const conversation = getActiveConversation();
    if (!conversation.messages.length) {
      messagesEl.appendChild(hintEl);
    } else {
      conversation.messages.forEach((item) => addBubble(item.role, item.content));
    }
    updateConversationActionState();
  }

  function anySettingsScreenOpen() {
    return settingsScreen.classList.contains("is-open") ||
      modelScreen.classList.contains("is-open") ||
      promptScreen.classList.contains("is-open") ||
      identityScreen.classList.contains("is-open");
  }

  function gateIsOpen() {
    return gate.style.display !== "none";
  }

  function syncInteractionState() {
    const settingsOpenNow = anySettingsScreenOpen();
    const mobileSidebarOpen = sidebarOpen && !desktopSidebarMedia.matches;
    const gateOpenNow = gateIsOpen();
    chatShell.inert = mobileSidebarOpen || gateOpenNow;
    topbarEl.inert = settingsOpenNow;
    messagesEl.inert = settingsOpenNow;
    composer.inert = settingsOpenNow;
    conversationSidebar.inert = !sidebarOpen || settingsOpenNow || gateOpenNow;
  }

  function syncSidebarLayout() {
    appShell.classList.toggle("sidebar-is-open", sidebarOpen);
    conversationsOpen.setAttribute("aria-expanded", String(sidebarOpen));
    conversationsOpen.setAttribute("aria-label", sidebarOpen ? "关闭会话列表" : "打开会话列表");
    conversationSidebar.setAttribute("aria-hidden", String(!sidebarOpen));
    conversationScrim.setAttribute("aria-hidden", "true");
    if (!desktopSidebarMedia.matches && sidebarOpen) {
      conversationSidebar.setAttribute("role", "dialog");
      conversationSidebar.setAttribute("aria-modal", "true");
      conversationSidebar.setAttribute("aria-labelledby", "conversation-sidebar-title");
    } else {
      conversationSidebar.setAttribute("role", "region");
      conversationSidebar.removeAttribute("aria-modal");
      conversationSidebar.removeAttribute("aria-labelledby");
    }
    syncInteractionState();
  }

  function openConversationSidebar(trigger = conversationsOpen) {
    closeQuickPanel();
    conversationSidebarTrigger = trigger;
    conversationMenuId = null;
    renamingConversationId = null;
    sidebarOpen = true;
    if (desktopSidebarMedia.matches) saveSidebarPreference(true);
    renderConversationList();
    syncSidebarLayout();
    window.requestAnimationFrame(() => {
      const active = conversationList.querySelector('[aria-current="page"]');
      (active || conversationClose).focus();
    });
  }

  function closeConversationSidebar({ returnFocus = true } = {}) {
    conversationMenuId = null;
    renamingConversationId = null;
    sidebarOpen = false;
    if (desktopSidebarMedia.matches) saveSidebarPreference(false);
    renderConversationList();
    syncSidebarLayout();
    const returnTarget = conversationSidebarTrigger || conversationsOpen;
    conversationSidebarTrigger = null;
    if (returnFocus && returnTarget instanceof HTMLElement) returnTarget.focus();
  }

  function toggleConversationSidebar() {
    if (sidebarOpen) closeConversationSidebar();
    else openConversationSidebar(conversationsOpen);
  }

  function trapConversationSidebarFocus(event) {
    if (
      event.key !== "Tab" ||
      !sidebarOpen ||
      desktopSidebarMedia.matches
    ) return;
    const focusable = [...conversationSidebar.querySelectorAll(
      'button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )].filter((element) => element.getClientRects().length > 0);
    if (!focusable.length) {
      event.preventDefault();
      conversationClose.focus();
      return;
    }
    const first = focusable[0];
    const last = focusable.at(-1);
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    } else if (!conversationSidebar.contains(document.activeElement)) {
      event.preventDefault();
      first.focus();
    }
  }

  function switchConversation(conversationId) {
    if (pending) {
      announceConversation("回复完成后可切换会话。");
      return;
    }
    if (conversationId === conversationStore.activeId) {
      if (!desktopSidebarMedia.matches) closeConversationSidebar();
      return;
    }
    if (!conversationById(conversationId)) return;
    const draft = cloneConversationStore();
    draft.activeId = conversationId;
    if (!persistConversationStore(draft)) return;
    conversationMenuId = null;
    renamingConversationId = null;
    renderConversationList();
    renderActiveConversation();
    if (!desktopSidebarMedia.matches) closeConversationSidebar();
  }

  function createNewConversation() {
    if (pending) {
      announceConversation("回复完成后可新建会话。");
      return;
    }
    const active = getActiveConversation();
    if (!active.messages.length && active.titleSource === "default") {
      if (!desktopSidebarMedia.matches) closeConversationSidebar({ returnFocus: false });
      input.focus();
      return;
    }
    const draft = cloneConversationStore();
    const created = createConversation();
    draft.conversations.push(created);
    draft.activeId = created.id;
    if (!persistConversationStore(draft)) return;
    renderConversationList();
    renderActiveConversation();
    announceConversation("已新建会话。");
    if (!desktopSidebarMedia.matches) closeConversationSidebar({ returnFocus: false });
    input.focus();
  }

  function saveConversationTitle(conversationId, rawTitle) {
    if (pending) {
      announceConversation("回复完成后可重命名。");
      return;
    }
    const title = normalizeConversationTitle(rawTitle);
    if (!title) {
      announceConversation("标题不能为空。");
      return;
    }
    const draft = cloneConversationStore();
    const target = conversationById(conversationId, draft);
    if (!target) return;
    target.title = title;
    target.titleSource = "manual";
    if (!persistConversationStore(draft)) return;
    renamingConversationId = null;
    conversationMenuId = null;
    renderConversationList();
    focusConversationMore(conversationId);
    announceConversation("标题已保存。");
  }

  function deleteConversation(conversationId) {
    if (pending) {
      announceConversation("回复完成后可删除会话。");
      return;
    }
    const target = conversationById(conversationId);
    if (!target || !window.confirm(`删除“${target.title}”？此操作不能撤销。`)) return;
    const deletingActiveConversation = conversationStore.activeId === conversationId;
    const orderedBeforeDelete = sortedConversations();
    const deletedIndex = orderedBeforeDelete.findIndex((item) => item.id === conversationId);
    const draft = cloneConversationStore();
    draft.conversations = draft.conversations.filter((item) => item.id !== conversationId);
    if (!draft.conversations.length) draft.conversations.push(createConversation());
    if (draft.activeId === conversationId) {
      draft.activeId = [...draft.conversations].sort(
        (a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt)
      )[0].id;
    }
    const adjacentConversationId = (
      orderedBeforeDelete[deletedIndex + 1] ||
      orderedBeforeDelete[deletedIndex - 1]
    )?.id;
    if (!persistConversationStore(draft)) return;
    conversationMenuId = null;
    renamingConversationId = null;
    renderConversationList();
    if (deletingActiveConversation) renderActiveConversation();
    focusConversationSelect(
      conversationById(adjacentConversationId)?.id || conversationStore.activeId
    );
    announceConversation("会话已删除。");
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function writeClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch {
        // Safari 或浏览器权限拒绝时，继续尝试兼容复制。
      }
    }
    const helper = document.createElement("textarea");
    helper.value = text;
    helper.setAttribute("readonly", "");
    helper.style.position = "fixed";
    helper.style.top = "0";
    helper.style.left = "-9999px";
    helper.style.opacity = "0";
    document.body.appendChild(helper);
    helper.select();
    helper.setSelectionRange(0, helper.value.length);
    const copied = document.execCommand("copy");
    helper.remove();
    if (!copied) throw new Error("浏览器未允许复制");
  }

  function messageRoleName(role) {
    return role === "user" ? userDisplayName : assistantDisplayName;
  }

  function makeMessageTools(role, bubble, visible) {
    const tools = document.createElement("div");
    tools.className = "message-tools";
    tools.hidden = !visible;

    const author = document.createElement("span");
    author.className = "message-author";
    author.textContent = messageRoleName(role);

    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "message-copy";
    copy.setAttribute("aria-label", `复制${messageRoleName(role)}的消息`);
    copy.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg><span class="message-copy-label" aria-live="polite">复制</span>';
    copy.addEventListener("click", async () => {
      const label = copy.querySelector(".message-copy-label");
      try {
        await writeClipboard(bubble.textContent);
        label.textContent = "已复制";
        copy.classList.add("is-copied");
      } catch {
        label.textContent = "复制失败";
      }
      window.setTimeout(() => {
        label.textContent = "复制";
        copy.classList.remove("is-copied");
      }, 1200);
    });

    tools.append(author, copy);
    return tools;
  }

  function revealMessageTools(bubble) {
    const tools = bubble.closest(".message-item")?.querySelector(".message-tools");
    if (tools) tools.hidden = false;
  }

  function updateMessageLabels() {
    document.querySelectorAll(".message-item").forEach((item) => {
      const role = item.dataset.role;
      const author = item.querySelector(".message-author");
      const copy = item.querySelector(".message-copy");
      if (author) author.textContent = messageRoleName(role);
      if (copy) copy.setAttribute("aria-label", `复制${messageRoleName(role)}的消息`);
    });
  }

  function addBubble(role, text) {
    if (hintEl) hintEl.remove();
    const root = document.createElement("div");
    root.className = `message-item ${role}`;
    root.dataset.role = role;
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    root.append(el, makeMessageTools(role, el, Boolean(text)));
    messagesEl.appendChild(root);
    scrollToBottom();
    return el;
  }

  function buildConversationMarkdown() {
    return getActiveConversation().messages
      .map((item) => `## ${messageRoleName(item.role)}\n\n${item.content.trim()}`)
      .join("\n\n")
      .trimEnd() + "\n";
  }

  function downloadConversation() {
    if (!getActiveConversation().messages.length || pending) return;
    const customBase = safeExportFileBase(exportFileName);
    const filename = `${customBase || defaultExportFileBase()}.md`;
    const blob = new Blob([buildConversationMarkdown()], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function addReasoningBlock({ webSearch }) {
    if (hintEl) hintEl.remove();
    const root = document.createElement("div");
    root.className = "reasoning is-open";

    const toggle = document.createElement("button");
    toggle.className = "reasoning-toggle";
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "true");

    const mark = document.createElement("span");
    mark.className = "reasoning-mark";
    mark.setAttribute("aria-hidden", "true");

    const title = document.createElement("span");
    title.className = "reasoning-title";
    title.textContent = webSearch ? "策划并搜索相关资料。" : "正在思考。";

    const done = document.createElement("span");
    done.className = "reasoning-done";
    done.textContent = "Done";

    const chevron = document.createElement("span");
    chevron.className = "reasoning-chevron";
    chevron.setAttribute("aria-hidden", "true");
    chevron.textContent = "⌄";

    const body = document.createElement("div");
    body.className = "reasoning-body";

    toggle.append(mark, title, done, chevron);
    root.append(toggle, body);

    if (webSearch) {
      const tools = document.createElement("div");
      tools.className = "reasoning-tools";
      const item = document.createElement("div");
      item.textContent = "联网搜索已开启";
      tools.appendChild(item);
      root.appendChild(tools);
    }

    toggle.addEventListener("click", () => {
      const open = !root.classList.contains("is-open");
      root.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
    });

    messagesEl.appendChild(root);
    scrollToBottom();

    let hasReasoning = false;
    return {
      root,
      append(delta) {
        hasReasoning = true;
        if (title.textContent === "正在思考。" || title.textContent === "策划并搜索相关资料。") {
          title.textContent = webSearch ? "策划并搜索相关资料。" : "整理思路。";
        }
        body.textContent += delta;
      },
      finish() {
        root.classList.add("is-done");
        root.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
        title.textContent = hasReasoning ? "思考完成" : "思考完成";
      },
    };
  }

  function addCitations(annotations) {
    const links = (annotations || [])
      .map((item) => item?.url_citation || item)
      .filter((item) => item?.url)
      .slice(0, 10);
    if (!links.length) return;

    const root = document.createElement("div");
    root.className = "citations";

    const toggle = document.createElement("button");
    toggle.className = "citations-toggle";
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "false");

    const summary = document.createElement("span");
    summary.textContent = `联网搜索 · 来源 ${links.length} 条`;

    const chevron = document.createElement("span");
    chevron.className = "citations-chevron";
    chevron.setAttribute("aria-hidden", "true");
    chevron.textContent = "⌄";

    const list = document.createElement("div");
    list.className = "citations-list";
    links.forEach((item) => {
      const a = document.createElement("a");
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noreferrer";
      a.textContent = item.title || new URL(item.url).hostname;
      list.appendChild(a);
    });

    toggle.append(summary, chevron);
    root.append(toggle, list);
    toggle.addEventListener("click", () => {
      const open = !root.classList.contains("is-open");
      root.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      if (open) scrollToBottom();
    });

    messagesEl.appendChild(root);
    scrollToBottom();
  }

  // 缓存状态小徽章：优先显示读取命中，其次显示本轮新写入；门槛由所选模型决定。
  function addCacheBadge(usage, modelId) {
    const details = usage?.prompt_tokens_details;
    const promptTokens = Number(usage?.prompt_tokens || 0);
    const cached = Number(details?.cached_tokens || 0);
    const written = Number(details?.cache_write_tokens || usage?.cache_write_tokens || 0);
    const isClaude = String(modelId || "").startsWith("anthropic/claude");
    if (!promptTokens || (!isClaude && !cached && !written)) return;

    const el = document.createElement("div");
    el.className = "cache-badge";
    el.title = "缓存是否生效取决于模型门槛和前缀是否保持一致";
    const num = document.createElement("span");
    num.className = "num";
    if (cached > 0) {
      el.classList.add("hit");
      num.textContent = `${cached.toLocaleString()} / ${promptTokens.toLocaleString()}`;
      el.append("缓存命中 ", num);
    } else if (written > 0) {
      el.classList.add("write");
      num.textContent = written.toLocaleString();
      el.append("缓存写入 ", num);
    } else {
      num.textContent = promptTokens.toLocaleString();
      el.append("本轮未命中 · 输入 ", num);
    }
    messagesEl.appendChild(el);
  }

  function textFromReasoningDetails(details) {
    if (!Array.isArray(details)) return "";
    return details
      .map((item) => item?.text || item?.summary || item?.content || "")
      .filter(Boolean)
      .join("\n");
  }

  // 解析 SSE 流，每收到一段文字就回调 callbacks，返回完整正文和来源
  async function readStream(body, callbacks) {
    const reader = body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    const annotations = [];
    let usage = null;                             // OpenRouter 在最后一个数据块里附带 token 账单
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();                       // 最后一行可能不完整，留到下次
      for (const line of lines) {
        const t = line.trim();
        if (!t || t.startsWith(":")) continue;    // 跳过空行和注释（如 OpenRouter 的心跳）
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (data === "[DONE]") return { full, annotations, usage };
        try {
          const obj = JSON.parse(data);
          if (obj.usage) usage = obj.usage;
          const delta = obj.choices?.[0]?.delta || {};
          const reasoning = delta.reasoning || delta.reasoning_content || textFromReasoningDetails(delta.reasoning_details);
          if (reasoning) callbacks.onReasoning(reasoning);
          if (Array.isArray(delta.annotations)) annotations.push(...delta.annotations);
          if (delta.content) {
            full += delta.content;
            callbacks.onContent(delta.content);
          }
        } catch { /* 半截 JSON，忽略 */ }
      }
    }
    return { full, annotations, usage };
  }

  async function requestConversationTitle(conversationId, firstMessage) {
    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "title",
          password: accessPw,
          text: firstMessage,
        }),
      });
      if (!response.ok) return;
      const data = await response.json().catch(() => null);
      const title = normalizeConversationTitle(data?.title);
      if ((title.match(/[\p{L}\p{N}]/gu) || []).length < 2) return;

      const draft = cloneConversationStore();
      const target = conversationById(conversationId, draft);
      const firstUserMessage = target?.messages.find((item) => item.role === "user");
      if (!target || target.titleSource !== "fallback" || firstUserMessage?.content !== firstMessage) return;
      target.title = title;
      target.titleSource = "deepseek";
      if (!persistConversationStore(draft)) return;
      if (!renamingConversationId) renderConversationList();
    } catch {
      // 自动标题失败时保留本地标题，不打断聊天。
    }
  }

  // ===== 发送 =====
  async function send() {
    const text = input.value.trim();
    if (!text || pending) return;
    const activeConversation = getActiveConversation();
    const requestConversationId = activeConversation.id;
    const requestSessionId = activeConversation.sessionId;
    const previousTitle = activeConversation.title;
    const previousTitleSource = activeConversation.titleSource;
    const previousUpdatedAt = activeConversation.updatedAt;
    const requestUserIndex = activeConversation.messages.length;
    const shouldGenerateTitle = activeConversation.messages.length === 0;
    const requestModel = currentModel;
    const requestEffort = normalizeEffortForModel(reasoningEffort, modelById(requestModel));
    const history = activeConversation.messages.map((item) => ({ ...item }));
    const requestMessages = systemPrompt.trim()
      ? [{ role: "system", content: systemPrompt.trim() }, ...history, { role: "user", content: text }]
      : [...history, { role: "user", content: text }];

    const draft = cloneConversationStore();
    const draftConversation = conversationById(requestConversationId, draft);
    if (!draftConversation) return;
    draftConversation.messages.push({ role: "user", content: text });
    draftConversation.updatedAt = new Date().toISOString();
    if (shouldGenerateTitle && draftConversation.titleSource !== "manual") {
      draftConversation.title = normalizeConversationTitle(text) || "新对话";
      draftConversation.titleSource = draftConversation.title === "新对话" ? "default" : "fallback";
    }
    if (!persistConversationStore(draft)) {
      input.focus();
      return;
    }

    input.value = "";
    input.style.height = "auto";
    addBubble("user", text);
    renderConversationList();

    setPending(true);
    if (shouldGenerateTitle) void requestConversationTitle(requestConversationId, text);
    const reasoningBox = requestEffort !== "off" ? addReasoningBlock({ webSearch: webSearchEnabled }) : null;
    const bubble = addBubble("assistant", "");
    bubble.classList.add("typing");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: requestMessages,
          model: requestModel,
          password: accessPw,
          reasoningEffort: requestEffort,
          session_id: requestSessionId,
          webSearch: webSearchEnabled,
          ...(maxCompletionTokens === null ? {} : { maxCompletionTokens }),
        }),
      });

      // 密码错误：清掉本地密码，待会弹回密码界面
      if (res.status === 401) {
        const e = new Error("访问密码错误");
        e.code = 401;
        throw e;
      }
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`服务返回 ${res.status}：${errText.slice(0, 300)}`);
      }
      // 正常应是 SSE 流；若不是，多半是 JSON 错误体
      if (!(res.headers.get("Content-Type") || "").includes("text/event-stream")) {
        const data = await res.json().catch(() => null);
        const msg = data?.error?.message || data?.error || "返回了非流式响应";
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }

      const { full, annotations, usage } = await readStream(res.body, {
        onReasoning(delta) {
          if (!reasoningBox) return;
          reasoningBox.append(delta);
          if (conversationStore.activeId === requestConversationId) scrollToBottom();
        },
        onContent(delta) {
          bubble.classList.remove("typing");
          bubble.textContent += delta;
          if (conversationStore.activeId === requestConversationId) scrollToBottom();
        },
      });

      bubble.classList.remove("typing");
      reasoningBox?.finish();
      if (full) {
        const completedDraft = cloneConversationStore();
        const completedConversation = conversationById(requestConversationId, completedDraft);
        if (completedConversation) {
          completedConversation.messages.push({ role: "assistant", content: full });
          completedConversation.updatedAt = new Date().toISOString();
          persistConversationStore(completedDraft, { keepInMemoryOnFailure: true });
          renderConversationList();
        }
        if (conversationStore.activeId === requestConversationId) {
          revealMessageTools(bubble);
          addCitations(annotations);
          addCacheBadge(usage, requestModel);
        }
      } else {
        bubble.classList.add("error");
        bubble.textContent = "⚠️ 没有收到回复内容";
      }
    } catch (err) {
      reasoningBox?.finish();
      bubble.classList.remove("typing");
      bubble.classList.add("error");
      bubble.textContent = "⚠️ " + err.message;
      if (err.code === 401) {
        localStorage.removeItem(PW_KEY);
        accessPw = "";
        const rollbackDraft = cloneConversationStore();
        const rollbackConversation = conversationById(requestConversationId, rollbackDraft);
        if (rollbackConversation) {
          const indexedMessage = rollbackConversation.messages[requestUserIndex];
          if (indexedMessage?.role === "user" && indexedMessage.content === text) {
            rollbackConversation.messages.splice(requestUserIndex, 1);
          } else {
            const fallbackIndex = rollbackConversation.messages.findLastIndex(
              (item) => item.role === "user" && item.content === text
            );
            if (fallbackIndex >= 0) rollbackConversation.messages.splice(fallbackIndex, 1);
          }
          rollbackConversation.title = previousTitle;
          rollbackConversation.titleSource = previousTitleSource;
          rollbackConversation.updatedAt = previousUpdatedAt;
          persistConversationStore(rollbackDraft, { keepInMemoryOnFailure: true });
        }
        renderConversationList();
        renderActiveConversation();
        showGate("密码错误，请重新输入");
      }
    } finally {
      setPending(false);
      if (conversationStore.activeId === requestConversationId) scrollToBottom();
    }
  }

  // ===== 交互绑定 =====
  composer.addEventListener("submit", (e) => {
    e.preventDefault();
    send();
  });

  // 输入框随内容自动长高
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  // 桌面端：回车发送、Shift+回车换行；触屏设备保持回车换行，靠按钮发送
  const isTouch = window.matchMedia("(pointer: coarse)").matches;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !isTouch) {
      e.preventDefault();
      send();
    }
  });

  // ===== 访问密码界面 =====
  function showGate(msg) {
    gate.style.display = "flex";
    gateErr.textContent = msg || "";
    syncInteractionState();
    gateInput.focus();
  }
  function focusActiveLayerAfterGate() {
    let target = input;
    if (modelScreen.classList.contains("is-open")) {
      target = modelBack;
    } else if (promptScreen.classList.contains("is-open")) {
      target = promptBack;
    } else if (identityScreen.classList.contains("is-open")) {
      target = identityBack;
    } else if (settingsScreen.classList.contains("is-open")) {
      target = settingsBack;
    } else if (sidebarOpen && !desktopSidebarMedia.matches) {
      target = conversationList.querySelector('[aria-current="page"]') || conversationClose;
    }
    window.requestAnimationFrame(() => target.focus());
  }
  function hideGate() {
    gate.style.display = "none";
    syncInteractionState();
    focusActiveLayerAfterGate();
  }
  function submitGate() {
    const v = gateInput.value.trim();
    if (!v) return;
    accessPw = v;
    localStorage.setItem(PW_KEY, v);
    gateInput.value = "";
    hideGate();
  }
  gateForm.addEventListener("submit", (event) => {
    event.preventDefault();
    submitGate();
  });

  conversationsOpen.addEventListener("click", toggleConversationSidebar);
  conversationClose.addEventListener("click", () => closeConversationSidebar());
  conversationScrim.addEventListener("click", () => closeConversationSidebar());
  conversationSidebar.addEventListener("keydown", trapConversationSidebarFocus);
  conversationNew.addEventListener("click", createNewConversation);
  conversationList.addEventListener("click", (event) => {
    const actionTarget = event.target.closest("[data-action]");
    if (!(actionTarget instanceof HTMLElement) || !conversationList.contains(actionTarget)) return;
    const action = actionTarget.dataset.action;
    const conversationId = actionTarget.dataset.conversationId ||
      actionTarget.closest("[data-conversation-id]")?.dataset.conversationId;
    if (action === "switch" && conversationId) {
      switchConversation(conversationId);
    } else if (action === "menu" && conversationId) {
      const closingMenu = conversationMenuId === conversationId;
      conversationMenuId = conversationMenuId === conversationId ? null : conversationId;
      renamingConversationId = null;
      renderConversationList();
      if (closingMenu) focusConversationMore(conversationId);
    } else if (action === "rename" && conversationId) {
      conversationMenuId = null;
      renamingConversationId = conversationId;
      renderConversationList();
    } else if (action === "delete" && conversationId) {
      deleteConversation(conversationId);
    } else if (action === "cancel-rename") {
      const cancelledConversationId = renamingConversationId;
      renamingConversationId = null;
      renderConversationList();
      if (cancelledConversationId) focusConversationMore(cancelledConversationId);
    }
  });
  conversationList.addEventListener("submit", (event) => {
    const form = event.target.closest(".conversation-rename-form");
    if (!(form instanceof HTMLFormElement)) return;
    event.preventDefault();
    const renameInput = form.querySelector(".conversation-rename-input");
    saveConversationTitle(form.dataset.conversationId, renameInput?.value || "");
  });
  desktopSidebarMedia.addEventListener("change", (event) => {
    sidebarOpen = event.matches
      ? loadSidebarPreference()
      : false;
    conversationMenuId = null;
    renamingConversationId = null;
    renderConversationList();
    syncSidebarLayout();
  });

  modelQuick.addEventListener("click", openQuickPanel);
  quickSettings.addEventListener("click", openSettings);
  settingsOpen.addEventListener("click", openSettings);
  settingsBack.addEventListener("click", () => closeSettings());
  settingsSave.addEventListener("click", saveSettings);
  settingsModelOpen.addEventListener("click", openModelScreen);
  settingsPromptOpen.addEventListener("click", openPromptScreen);
  settingsIdentityOpen.addEventListener("click", openIdentityScreen);
  modelBack.addEventListener("click", closeModelScreen);
  promptBack.addEventListener("click", closePromptScreen);
  identityBack.addEventListener("click", closeIdentityScreen);
  modelSearch.addEventListener("input", renderModelList);
  modelsRetry.addEventListener("click", () => void fetchModels({ force: true }));
  modelScroll.addEventListener("scroll", updateModelScrollTop, { passive: true });
  modelsScrollTop.addEventListener("click", scrollModelsToTop);
  systemPromptInput.addEventListener("input", () => {
    autoGrowSystemPrompt();
    updatePromptCount();
  });
  userDisplayNameInput.addEventListener("input", updateIdentitySummary);
  assistantDisplayNameInput.addEventListener("input", updateIdentitySummary);
  exportFileNameInput.addEventListener("input", updateIdentitySummary);
  maxCompletionTokensInput.addEventListener("input", () => {
    draftMaxCompletionTokens = maxCompletionTokensInput.value.trim();
    updateSettingsDirty();
  });
  maxCompletionTokensInput.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
    event.preventDefault();
    stepMaxCompletionTokens(event.key === "ArrowUp" ? 1 : -1);
  });
  maxTokensDown.addEventListener("click", () => stepMaxCompletionTokens(-1));
  maxTokensUp.addEventListener("click", () => stepMaxCompletionTokens(1));
  webToggle.addEventListener("click", () => {
    webSearchEnabled = !webSearchEnabled;
    localStorage.setItem(WEB_KEY, webSearchEnabled ? "1" : "0");
    updateTopbar();
  });
  document.addEventListener("click", (event) => {
    if (!event.composedPath().includes(document.querySelector(".model-control"))) {
      closeQuickPanel();
    }
    if (conversationMenuId && !event.target.closest(".conversation-item")) {
      conversationMenuId = null;
      renderConversationList();
    }
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (modelScreen.classList.contains("is-open")) {
      closeModelScreen({ instant: true });
    } else if (promptScreen.classList.contains("is-open")) {
      closePromptScreen({ instant: true });
    } else if (identityScreen.classList.contains("is-open")) {
      closeIdentityScreen({ instant: true });
    } else if (settingsScreen.classList.contains("is-open")) {
      closeSettings({ instant: true });
    } else if (renamingConversationId) {
      const cancelledConversationId = renamingConversationId;
      renamingConversationId = null;
      renderConversationList();
      focusConversationMore(cancelledConversationId);
    } else if (conversationMenuId) {
      const closedConversationId = conversationMenuId;
      conversationMenuId = null;
      renderConversationList();
      focusConversationMore(closedConversationId);
    } else if (sidebarOpen) {
      closeConversationSidebar();
    } else if (quickPanel.classList.contains("is-open")) {
      closeQuickPanel();
      modelQuick.focus();
    }
  });
  exportChatBtn.addEventListener("click", downloadConversation);
  clearChatBtn.addEventListener("click", () => {
    if (pending || !window.confirm("清空当前会话？其他会话不会受影响，此操作不能撤销。")) return;
    const draft = cloneConversationStore();
    const active = getActiveConversation(draft);
    active.messages = [];
    active.title = "新对话";
    active.titleSource = "default";
    active.sessionId = createSessionId();
    active.updatedAt = new Date().toISOString();
    if (!persistConversationStore(draft)) return;
    renderConversationList();
    renderActiveConversation();
    announceConversation("当前会话已清空。");
    input.focus();
  });
  updateTopbar();
  renderConversationList();
  renderActiveConversation();
  syncSidebarLayout();
  if (conversationStoreLoadWarning) showAppStatus(conversationStoreLoadWarning);

  // 没存过密码就先弹密码界面（密码不写在代码里，由你打开时手输一次）
  if (!accessPw) showGate();
  else syncInteractionState();
</script>
</body>
</html>
