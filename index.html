<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f5" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23d97757'/%3E%3C/svg%3E" />
<title>ember</title>
<style>
  /* ===== 设计 token（怀旧版 / Claude Theme，取自 DESIGN 设计稿）===== */
  :root {
    --font-display: 'Anthropic Serif', Georgia, 'Times New Roman', serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    --bg-primary: #faf9f5;
    --bg-card: #ffffff;
    --text-primary: #141413;
    --text-secondary: #3d3d3a;
    --text-muted: #9b9b97;
    --accent: #d97757;
    --btn-primary-bg: #3b3b3b;

    --shadow:    0 3px 15px rgba(0,0,0,0.05), 0 0 0 0.5px rgba(31,30,29,0.12);
    --shadow-sm: 0 3px 15px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(31,30,29,0.2);

    --radius: 20px;
    --radius-sm: 8px;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --motion-fast: 160ms;
    --motion-panel: 240ms;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-primary);
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 应用框架与会话侧栏 ===== */
  .app-shell {
    position: relative;
    display: flex;
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .chat-shell {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .app-status {
    position: fixed;
    z-index: 40;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    width: min(calc(100vw - 32px), 520px);
    padding: 10px 14px;
    color: #7c2d12;
    background: rgba(255,255,255,.96);
    border: .5px solid rgba(154,52,18,.22);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(31,30,29,.12);
    font-size: 13px;
    line-height: 1.45;
    text-align: center;
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -8px);
    transition:
      opacity var(--motion-fast) ease,
      transform var(--motion-fast) var(--ease-out),
      visibility 0s linear var(--motion-fast);
  }
  .app-status.is-visible {
    visibility: visible;
    opacity: 1;
    transform: translate(-50%, 0);
    transition-delay: 0s;
  }
  .conversation-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 12;
    width: min(86vw, 320px);
    overflow: hidden;
    color: var(--text-primary);
    background: var(--bg-primary);
    border-right: .5px solid rgba(31,30,29,.13);
    box-shadow: 16px 0 44px rgba(31,30,29,.1);
    visibility: hidden;
    pointer-events: none;
    transform: translateX(-100%);
    transition:
      transform var(--motion-panel) var(--ease-drawer),
      visibility 0s linear var(--motion-panel);
  }
  .app-shell.sidebar-is-open .conversation-sidebar {
    visibility: visible;
    pointer-events: auto;
    transform: translateX(0);
    transition-delay: 0s;
  }
  .conversation-sidebar-inner {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding:
      calc(8px + env(safe-area-inset-top))
      10px
      calc(10px + env(safe-area-inset-bottom));
  }
  .conversation-sidebar-header {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 2px;
    min-height: 48px;
    padding-left: 8px;
  }
  .conversation-sidebar-header h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: .1px;
  }
  .conversation-sidebar-action,
  .conversation-more,
  .conversation-menu-button,
  .conversation-rename-action {
    display: grid;
    place-items: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition:
      color var(--motion-fast) ease,
      background-color var(--motion-fast) ease,
      transform var(--motion-fast) var(--ease-out);
  }
  .conversation-sidebar-action svg,
  .conversation-more svg,
  .conversation-menu-button svg,
  .conversation-rename-action svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .conversation-sidebar-action:disabled,
  .conversation-more:disabled,
  .conversation-menu-button:disabled,
  .conversation-rename-action:disabled {
    opacity: .35;
    cursor: default;
  }
  .conversation-pending-note {
    min-height: 0;
    margin: 0 8px;
    overflow: hidden;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.4;
  }
  .conversation-pending-note:not(:empty) {
    min-height: 30px;
    padding: 5px 0 8px;
  }
  .conversation-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 3px 0 16px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .conversation-item {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px;
    align-items: center;
    min-height: 60px;
    margin: 2px 0;
    border-radius: 14px;
  }
  .conversation-item.active {
    background: rgba(217,119,87,.09);
  }
  .conversation-select {
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    min-width: 0;
    min-height: 60px;
    padding: 8px 2px 8px 11px;
    color: inherit;
    background: transparent;
    border: none;
    border-radius: 14px 0 0 14px;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .conversation-select:disabled {
    cursor: default;
  }
  .conversation-current-mark {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
  }
  .conversation-item.active .conversation-current-mark {
    background: var(--accent);
  }
  .conversation-copy {
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 2px;
  }
  .conversation-title {
    overflow: hidden;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 610;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conversation-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.35;
  }
  .conversation-preview {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conversation-time {
    flex: none;
    font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 10px;
  }
  .conversation-more {
    width: 44px;
    height: 44px;
  }
  .conversation-menu {
    position: absolute;
    z-index: 2;
    top: 47px;
    right: 5px;
    width: 132px;
    padding: 5px;
    background: var(--bg-card);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(31,30,29,.14), 0 0 0 .5px rgba(31,30,29,.13);
  }
  .conversation-menu-button {
    display: flex;
    justify-content: flex-start;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    font: inherit;
    font-size: 13px;
  }
  .conversation-menu-button svg {
    width: 17px;
    height: 17px;
  }
  .conversation-menu-button.danger {
    color: #9a3412;
  }
  .conversation-rename-form {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px 44px;
    align-items: center;
    min-height: 60px;
    padding-left: 10px;
  }
  .conversation-rename-input {
    min-width: 0;
    height: 38px;
    padding: 7px 10px;
    color: var(--text-primary);
    background: var(--bg-card);
    border: none;
    border-radius: 10px;
    box-shadow: var(--shadow);
    font: inherit;
    font-size: 14px;
    outline: none;
  }
  .conversation-live {
    min-height: 20px;
    padding: 0 8px;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.4;
  }
  .conversation-scrim {
    position: fixed;
    inset: 0;
    z-index: 11;
    padding: 0;
    background: rgba(20,20,19,.2);
    border: none;
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition:
      opacity var(--motion-fast) ease,
      visibility 0s linear var(--motion-fast);
  }
  .app-shell.sidebar-is-open .conversation-scrim {
    visibility: visible;
    pointer-events: auto;
    opacity: 1;
    transition-delay: 0s;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    flex: none;
    position: relative;
    z-index: 4;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    min-height: calc(64px + env(safe-area-inset-top));
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px 18px;
    border-bottom: 0.5px solid rgba(31,30,29,0.12);
    background: var(--bg-primary);
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-self: start;
    min-width: 0;
    min-height: 44px;
    margin-left: -6px;
    padding: 0 6px;
    color: inherit;
    background: transparent;
    border: none;
    border-radius: 12px;
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity var(--motion-fast) ease;
  }
  .brand-wrap:active { opacity: .62; }
  .model-control {
    position: relative;
    justify-self: center;
    min-width: 0;
  }
  .model-quick {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 44px;
    max-width: 138px;
    min-height: 44px;
    padding: 7px 10px;
    border: none;
    border-radius: 12px;
    color: var(--text-secondary);
    background: transparent;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }
  .model-quick:active,
  .icon-button:active {
    transform: scale(.97);
  }
  .model-quick-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-quick svg {
    flex: none;
    width: 15px;
    height: 15px;
    transition: transform var(--motion-fast) var(--ease-out);
  }
  .model-quick[aria-expanded="true"] svg { transform: rotate(180deg); }
  .topbar-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .topbar-actions .icon-button {
    position: relative;
    width: 40px;
    height: 40px;
  }
  .topbar-actions .icon-button::after {
    content: "";
    position: absolute;
    inset: -2px 0;
  }
  .tool-clear {
    color: var(--text-muted);
  }
  .icon-button:disabled {
    opacity: .35;
    cursor: default;
  }
  .icon-button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: color var(--motion-fast) ease, transform var(--motion-fast) var(--ease-out);
  }
  .icon-button svg,
  .settings-back svg,
  .search-icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .quick-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    width: min(280px, calc(100vw - 24px));
    padding: 14px;
    color: var(--text-primary);
    background: rgba(255,255,255,.97);
    border-radius: 18px;
    box-shadow: 0 14px 38px rgba(31,30,29,.15), 0 0 0 .5px rgba(31,30,29,.16);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(-50%) translateY(-5px) scale(.98);
    transform-origin: top center;
    transition:
      opacity var(--motion-fast) var(--ease-out),
      transform var(--motion-fast) var(--ease-out),
      visibility 0s linear var(--motion-fast);
  }
  .quick-panel.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0) scale(1);
    transition-delay: 0s;
  }
  .quick-model-id {
    display: block;
    margin-bottom: 11px;
    overflow: hidden;
    color: var(--text-muted);
    font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .control-label {
    display: block;
    margin-bottom: 7px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .effort-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    padding: 2px;
    background: rgba(31,30,29,.055);
    border: .5px solid rgba(31,30,29,.08);
    border-radius: 11px;
  }
  .effort-option {
    position: relative;
    min-height: 40px;
    padding: 6px 3px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .effort-option::after {
    content: "";
    position: absolute;
    inset: -2px 0;
  }
  .effort-option[aria-pressed="true"] {
    color: #fff;
    background: var(--btn-primary-bg);
  }
  .effort-option:disabled {
    opacity: .35;
    cursor: default;
  }
  .quick-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 44px;
    margin-top: 8px;
    padding: 5px 3px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-top: .5px solid rgba(31,30,29,.1);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .quick-state {
    color: var(--text-muted);
    font-size: 12px;
  }
  .quick-chevron {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--text-muted);
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .spark {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }
  .brand {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--text-primary);
    letter-spacing: 0.2px;
  }

  /* ===== 消息区 ===== */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .hint {
    margin: auto;
    color: var(--text-muted);
    font-size: 14px;
  }

  .message-item {
    display: flex;
    flex-direction: column;
    width: fit-content;
    max-width: 85%;
    min-width: 0;
  }
  .message-item.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .message-item.assistant {
    align-self: flex-start;
    align-items: flex-start;
  }
  .msg {
    max-width: 100%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg.assistant {
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: var(--shadow);
    border-bottom-left-radius: 6px;
  }
  .message-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    margin: 0 4px;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1;
  }
  .message-author {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .message-copy {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 36px;
    padding: 2px 4px;
    color: inherit;
    background: transparent;
    border: none;
    border-radius: 8px;
    font: inherit;
    cursor: pointer;
    transition: color var(--motion-fast) ease, transform var(--motion-fast) var(--ease-out);
  }
  .message-copy::after {
    content: "";
    position: absolute;
    inset: -4px 0;
  }
  .message-copy svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .message-copy.is-copied { color: var(--accent); }
  .reasoning {
    align-self: flex-start;
    max-width: 85%;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .reasoning-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .reasoning-mark {
    position: relative;
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg, rgba(217,119,87,0), rgba(217,119,87,0.95), rgba(217,119,87,0));
    animation: spin 1.4s linear infinite;
  }
  .reasoning-mark::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--bg-primary);
  }
  .reasoning.is-done .reasoning-mark {
    border: 1.5px solid rgba(31,30,29,0.32);
    background: transparent;
    animation: none;
  }
  .reasoning.is-done .reasoning-mark::after {
    inset: 4px;
    width: 7px;
    height: 4px;
    border-left: 1.5px solid rgba(31,30,29,0.55);
    border-bottom: 1.5px solid rgba(31,30,29,0.55);
    border-radius: 0;
    background: transparent;
    transform: rotate(-45deg);
  }
  .reasoning-title {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .reasoning-done {
    display: none;
    color: var(--text-muted);
  }
  .reasoning.is-done .reasoning-done {
    display: inline;
  }
  .reasoning-chevron {
    color: var(--text-muted);
    transition: transform .18s ease;
  }
  .reasoning.is-open .reasoning-chevron {
    transform: rotate(180deg);
  }
  .reasoning-body {
    display: none;
    margin: 10px 0 0 9px;
    padding: 0 0 0 18px;
    border-left: 1px solid rgba(31,30,29,0.14);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reasoning.is-open .reasoning-body {
    display: block;
  }
  .reasoning-tools {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0 0 9px;
    padding: 0 0 0 18px;
    border-left: 1px solid rgba(31,30,29,0.14);
    color: var(--text-muted);
  }
  .reasoning:not(.is-open) .reasoning-tools {
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .citations {
    align-self: flex-start;
    max-width: 85%;
    min-width: 0;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .citations-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: 100%;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .citations-chevron {
    flex: none;
    color: var(--text-muted);
    transition: transform .18s ease;
  }
  .citations.is-open .citations-chevron {
    transform: rotate(180deg);
  }
  .citations-list {
    display: none;
    flex-direction: column;
    gap: 6px;
    max-width: 100%;
    margin-top: 8px;
  }
  .citations.is-open .citations-list {
    display: flex;
  }
  .citations-list a {
    max-width: 100%;
    color: var(--text-secondary);
    overflow-wrap: anywhere;
  }
  .msg.error {
    align-self: flex-start;
    background: #fbeae5;
    color: #9a3412;
    box-shadow: none;
  }
  .cache-badge {
    align-self: flex-start;

    margin-top: -6px;
    padding-left: 15px;
    color: var(--text-muted);

    line-height: 1.4;

  }

  }
  .cache-badge.write .num {

  /* 等待首字时的呼吸光标 */
  .msg.typing::after {
    content: '';
    display: inline-block;

    margin: 0 2px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

  /* ===== 底部输入栏 ===== */
  .composer {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));

    background: var(--bg-primary);
  }
  #input {

    resize: none;
    max-height: 120px;
    padding: 11px 15px;
    font-family: var(--font-ui);

    color: var(--text-primary);
    background: var(--bg-card);
    border: none;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    outline: none;

  #send {

    line-height: 1;

    transition: opacity .2s, transform .2s;

  #send:disabled { opacity: .4; cursor: default; }

  /* ===== 全屏设置 ===== */
  .settings-screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-primary);
    visibility: hidden;
    pointer-events: none;
    opacity: .98;
    transform: translateX(100%);
    transition:
      transform var(--motion-panel) var(--ease-out),
      opacity var(--motion-panel) var(--ease-out),
      visibility 0s linear var(--motion-panel);
  }
  .settings-child-screen { z-index: 21; }
  .settings-screen.skip-motion { transition: none !important; }
  .settings-screen.is-open {
    visibility: visible;
    pointer-events: auto;
    opacity: 1;
    transform: translateX(0);
    transition-delay: 0s;
  }
  .settings-header {
    flex: none;
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    min-height: calc(64px + env(safe-area-inset-top));

    border-bottom: .5px solid rgba(31,30,29,.12);
    background: var(--bg-primary);
  }
  .settings-header h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 500;
    line-height: 1.2;
    text-align: center;
  }
  .settings-back,
  .settings-nav-row,
  .model-star,
  .models-retry,
  .token-step,
  .models-scroll-top,
  .message-copy {
    -webkit-tap-highlight-color: transparent;
  }
  .settings-back {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 12px;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .settings-back svg,
  .settings-nav-chevron,
  .models-scroll-top svg,
  .token-step svg {
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .settings-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .settings-content {
    width: min(100%, 720px);
    margin: 0 auto;
    padding: 20px 18px 36px;
  }
  .settings-main-content { max-width: 600px; }
  .settings-section + .settings-section { margin-top: 22px; }
  .settings-section-title {
    margin: 0 0 8px 3px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 650;
  }
  .settings-nav-group,
  .settings-card,
  .model-list {
    background: var(--bg-card);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  .settings-nav-group,
  .model-list { overflow: hidden; }
  .settings-nav-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 66px;
    padding: 11px 13px 11px 15px;
    color: var(--text-primary);
    background: transparent;
    border: none;
    font: inherit;
    text-align: left;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .settings-nav-row + .settings-nav-row::before {
    content: "";
    position: absolute;
    top: 0;
    right: 14px;
    left: 58px;
    height: .5px;
    background: rgba(31,30,29,.1);
  }
  .settings-nav-icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    color: var(--accent);
    background: rgba(217,119,87,.1);
    border-radius: 10px;
  }
  .settings-nav-icon svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .current-model-mark {
    width: 22px;
    height: 22px;
    border: 6px solid var(--accent);
    border-radius: 50%;
  }
  .settings-nav-copy {
    min-width: 0;
    flex: 1;
  }
  .settings-nav-title,
  .settings-nav-summary {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .settings-nav-title {
    font-size: 15px;
    font-weight: 650;
  }
  .settings-nav-summary {
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .settings-model-id {
    font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 11px;
  }
  .settings-nav-chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: #b5b5b0;
    stroke-width: 1.8;
  }
  .settings-card { padding: 15px; }
  .settings-card-label {
    display: block;
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: 650;
  }
  .settings-note {
    margin: 9px 0 0;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .generation-card { padding: 0; overflow: hidden; }
  .generation-block { padding: 15px; }
  .generation-block + .generation-block {
    border-top: .5px solid rgba(31,30,29,.1);
  }
  .max-token-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .max-token-row > .settings-card-label { margin: 0; }
  .max-token-controls {
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 1px;
    background: rgba(31,30,29,.045);
    border: .5px solid rgba(31,30,29,.13);
    border-radius: 11px;
  }
  #max-completion-tokens {
    width: 80px;
    min-height: 40px;
    padding: 8px 7px;
    color: var(--text-primary);
    background: transparent;
    border: 0;
    border-radius: 10px 0 0 10px;
    outline: none;
    font: 13px 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    text-align: center;
    appearance: textfield;
  }
  #max-completion-tokens::-webkit-inner-spin-button,
  #max-completion-tokens::-webkit-outer-spin-button { appearance: none; margin: 0; }
  #max-completion-tokens::placeholder { color: var(--text-muted); }
  .token-step {
    position: relative;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    padding: 0;
    color: var(--text-secondary);
    background: transparent;
    border: 0;
    border-radius: 0;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .token-step::before {
    content: "";
    position: absolute;
    top: 7px;
    bottom: 7px;
    left: 0;
    width: .5px;
    background: rgba(31,30,29,.13);
  }
  .token-step::after {
    content: "";
    position: absolute;
    inset: -2px 0;
  }
  .token-step:last-child { border-radius: 0 10px 10px 0; }
  .token-step svg {
    position: relative;
    z-index: 1;
    width: 15px;
    height: 15px;
    stroke-width: 1.8;
  }
  .max-token-error {
    display: block;
    min-height: 17px;
    margin: 7px 1px 0;
    color: #9a3412;
    font-size: 11px;
    line-height: 1.4;
  }
  .model-toolbar {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 14px 18px 4px;
    background: linear-gradient(var(--bg-primary) 80%, rgba(250,249,245,0));
  }
  .model-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
    color: var(--text-muted);
  }
  .model-search-wrap .search-icon {
    position: absolute;
    left: 13px;
    width: 17px;
    height: 17px;
    pointer-events: none;
  }
  #model-search {
    width: 100%;
    min-height: 46px;
    padding: 10px 42px 10px 39px;
    color: var(--text-primary);
    background: rgba(31,30,29,.06);
    border: none;
    border-radius: 14px;
    outline: none;
    font: inherit;
    font-size: 16px;
  }
  #model-search::placeholder,
  #system-prompt::placeholder { color: var(--text-muted); }
  .models-retry {
    position: absolute;
    right: 1px;
    display: grid;
    place-items: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: 10px;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .models-retry svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .models-status {
    display: block;
    min-height: 18px;
    margin: 7px 2px 0;
    color: var(--text-muted);
    font-size: 12px;
  }
  .model-page-content { padding-top: 8px; padding-bottom: 110px; }
  .model-group-label {
    padding: 9px 14px 7px;
    color: var(--text-muted);
    background: rgba(31,30,29,.035);
    font-size: 11px;
    font-weight: 650;
  }
  .model-choice {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px;
    align-items: center;
    min-height: 61px;
    border-bottom: .5px solid rgba(31,30,29,.1);
  }
  .model-choice:last-child { border-bottom: none; }
  .model-choice.active { background: rgba(217,119,87,.075); }
  .model-choice-select {
    display: flex;
    align-items: center;
    min-width: 0;
    min-height: 60px;
    padding: 8px 10px 8px 15px;
    color: inherit;
    background: transparent;
    border: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .model-choice-text { min-width: 0; }
  .model-choice-name,
  .model-choice-id {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-choice-name { font-size: 14px; font-weight: 650; }
  .model-choice-id {
    color: var(--text-muted);
    font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 11px;
  }
  .model-star {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    color: #aaa49b;
    background: transparent;
    border: none;
    border-radius: 12px;
    transition: transform var(--motion-fast) var(--ease-out);
    cursor: pointer;
  }
  .model-star svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .model-star[aria-pressed="true"] { color: var(--accent); }
  .models-scroll-top {
    position: absolute;
    z-index: 3;
    right: auto;
    bottom: calc(22px + env(safe-area-inset-bottom));
    left: 50%;
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    padding: 0;
    color: var(--text-secondary);
    background: rgba(255,255,255,.66);
    border: .5px solid rgba(31,30,29,.16);
    border-radius: 50%;
    box-shadow: 0 10px 32px rgba(31,30,29,.14);
    backdrop-filter: blur(18px) saturate(1.35);
    -webkit-backdrop-filter: blur(18px) saturate(1.35);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, 10px);
    transition:
      opacity var(--motion-fast) ease,
      transform var(--motion-fast) var(--ease-out),
      visibility 0s linear var(--motion-fast);
    cursor: pointer;
  }
  .models-scroll-top.is-visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translate(-50%, 0);
    transition-delay: 0s;
  }
  .models-scroll-top svg { width: 21px; height: 21px; stroke-width: 1.8; }
  .prompt-page-content { padding-top: 18px; padding-bottom: 48px; }
  .prompt-editor-card {
    padding: 15px;
    background: var(--bg-card);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  #system-prompt {
    display: block;
    width: 100%;
    min-height: 220px;
    overflow: hidden;
    resize: none;
    padding: 2px;
    color: var(--text-primary);
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.6;
  }
  .prompt-meta {
    display: flex;

    margin-top: 12px;

  }
  .identity-page-content {

  }

  }
  .identity-field {

  }
  .identity-field + .identity-field {

  .identity-input {
    display: block;

    color: var(--text-primary);
    background: rgba(31,30,29,.045);

    font-size: 16px;
  }
  .identity-input::placeholder { color: var(--text-muted); }

  .settings-footer {

  .settings-save {
    display: block;
    width: min(100%, 564px);
    min-height: 48px;
    margin: 0 auto;
    color: #fff;
    background: var(--btn-primary-bg);

  .models-retry:active,
  .token-step:active,

  /* ===== 访问密码遮罩 ===== */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg-primary);
  }
  .gate-card {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 28px 24px;
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .gate-brand { font-family: var(--font-display); font-size: 24px; color: var(--text-primary); }
  .gate-hint { font-size: 14px; color: var(--text-muted); margin-top: -6px; }
  .gate-input {
    width: 100%;
    padding: 11px 15px;
    font-size: 16px;
    color: var(--text-primary);
    background: var(--bg-primary);
    border: none;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    outline: none;
    text-align: center;

    padding: 11px;
    font-size: 15px;

      height: 44px;
    }

      min-height: 72px;
      padding-top: 13px;
      padding-bottom: 13px;
    }
    .effort-options {
      padding: 3px;
      border-radius: 13px;
    }
    .effort-option {
      min-height: 48px;
      border-radius: 10px;
      font-size: 14px;
    }
    .effort-option::after { inset: 0; }
    .message-tools {
      min-height: 40px;
      font-size: 12px;
    }
    .message-copy {
      min-height: 40px;
      padding-inline: 6px;
    }
    .message-copy::after { inset: -2px 0; }
    .identity-field { padding: 17px; }
    .identity-input {
      min-height: 48px;
      padding: 11px 13px;
    }
    .max-token-controls {
      padding: 2px;
      border-radius: 13px;
    }
    #max-completion-tokens {
      width: 120px;
      min-height: 48px;
      padding: 10px;
      border-radius: 11px 0 0 11px;
      font-size: 15px;
    }
    .token-step {
      width: 48px;
      height: 48px;
    }

      top: 9px;
      bottom: 9px;
    }
    .token-step::after { inset: 0; }
    .token-step:last-child { border-radius: 0 11px 11px 0; }

      width: 17px;
      height: 17px;
    }

  @media (min-width: 900px) {
    .conversation-sidebar {
      position: relative;
      inset: auto;
      z-index: 5;
      flex: none;
      width: 0;

      transform: translateX(0);

    .conversation-meta { font-size: 12px; }
    .conversation-time { font-size: 11px; }

  }

  @media (hover: hover) and (pointer: fine) {
    .conversation-sidebar-action:hover:not(:disabled),
    .conversation-more:hover:not(:disabled),
    .conversation-menu-button:hover:not(:disabled),
    .conversation-rename-action:hover:not(:disabled),
    .conversation-select:hover:not(:disabled),

    .icon-button:hover,
    .settings-back:hover,
    .settings-nav-row:hover,
    .model-star:hover,

    .model-choice.active:hover { background: rgba(217,119,87,.095); }
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  [role="button"]:focus-visible {
    outline: 2px solid rgba(217,119,87,.65);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .conversation-sidebar,
    .conversation-sidebar-inner,
    .conversation-scrim,
    .app-status {
      transition: opacity var(--motion-fast) ease, visibility 0s linear var(--motion-fast);
